<style>
/* Layout: full-bleed canvas apartment; HUD floats top, actions + nav dock bottom; sheets slide over (side panel on wide screens). */
:root{
  color-scheme: dark;
  --bg:#110c0a;
  --panel:rgba(34,25,21,.80);
  --panel-2:rgba(22,16,13,.86);
  --solid:#1c1411;
  --line:rgba(255,214,170,.13);
  --text:#f7ede3;
  --muted:#b8a495;
  --amber:#f6a944;
  --rust:#c8662e;
  --joy:#ff6f86;
  --food:#f6a944;
  --water:#4fb4ff;
  --energy:#b6e35a;
  --good:#7ed36a;
  --violet:#a98bff;
  --font-display:'Fredoka','Baloo 2','Trebuchet MS',system-ui,sans-serif;
  --font-body:'Figtree','Segoe UI',system-ui,-apple-system,sans-serif;
  --r:18px;
}
[hidden]{display:none!important}
html{box-sizing:border-box;height:100%;background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
#app{position:relative;height:100%;overflow:hidden}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block}
.glass{background:linear-gradient(180deg,rgba(44,32,26,.80),rgba(20,14,12,.82));border:1px solid var(--line);border-radius:var(--r);box-shadow:0 10px 30px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,230,200,.06);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
svg{display:block}

/* ---------- HUD top ---------- */
.hud{position:absolute;top:10px;left:12px;right:12px;display:flex;gap:8px;align-items:stretch;pointer-events:none;z-index:5}
.hud>*{pointer-events:auto}
.profile{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:10px;padding:6px 12px 6px 6px}
#avatar{width:52px;height:52px;border-radius:50%;flex:none;box-shadow:0 0 0 2px var(--amber),0 4px 14px rgba(246,169,68,.25)}
.pinfo{min-width:0;flex:1}
.pname{font-family:var(--font-display);font-weight:700;font-size:22px;line-height:1.05;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plv{display:grid;grid-template-columns:auto 1fr;align-items:center;column-gap:8px;row-gap:3px;margin-top:3px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.plv>span:first-child{white-space:nowrap}
.plv .xptxt{grid-column:1/-1;font-size:11px}
.plv b{color:var(--text);font-weight:700}
.xpbar{flex:1;min-width:36px;height:7px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden}
.xpbar i{display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,#f6a944,#ffd36e);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.xptxt{white-space:nowrap}
.chips{display:flex;gap:8px;flex:none}
.chip{display:flex;align-items:center;gap:6px;padding:6px 11px 6px 9px}
.chip.streak{flex-direction:column;justify-content:center;gap:0;padding:6px 12px;min-width:68px}
.streak .sn{display:flex;align-items:center;gap:4px;font-family:var(--font-display);font-weight:700;font-size:24px;line-height:1}
.streak .sn svg{width:20px;height:22px;filter:drop-shadow(0 0 6px rgba(255,120,40,.6))}
.streak small{font-size:11px;color:var(--muted);letter-spacing:.4px;text-transform:uppercase}
.chip.bones{flex-direction:column;justify-content:center;gap:2px;padding:6px 10px;min-width:54px}
.bones .bn{display:flex;align-items:center;gap:4px;font-family:var(--font-display);font-weight:600;font-size:18px;line-height:1;font-variant-numeric:tabular-nums}
.bones svg{width:18px;height:18px;color:#efe0c8}
.bones small{font-size:10px;color:var(--muted);letter-spacing:.4px;text-transform:uppercase}
.bump{animation:bump .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}

/* ---------- side column: stats, goals, caption ---------- */
.side{position:absolute;left:12px;right:12px;top:80px;display:flex;flex-direction:column;gap:8px;z-index:5;pointer-events:none}
.side>*{pointer-events:auto}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding:9px 12px}
.stat{min-width:0}
.stat .sl{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:600;white-space:nowrap}
.stat .sl svg{width:15px;height:15px;flex:none}
.stat .sl span{overflow:hidden;text-overflow:ellipsis}
.bar{height:7px;margin-top:6px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden}
.bar i{display:block;height:100%;border-radius:inherit;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.st-joy svg{color:var(--joy)} .st-joy .bar i{background:linear-gradient(90deg,#e8536c,#ff8fa1)}
.st-food svg{color:var(--food)} .st-food .bar i{background:linear-gradient(90deg,#e08a2a,#ffc56b)}
.st-water svg{color:var(--water)} .st-water .bar i{background:linear-gradient(90deg,#2f8fe0,#7fcbff)}
.st-energy svg{color:var(--energy)} .st-energy .bar i{background:linear-gradient(90deg,#7fc23a,#d3f27a)}
.stat.low .bar i{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}

/* ---------- goals + caption ---------- */
.goals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.goal{display:flex;align-items:center;gap:7px;padding:7px 8px;text-align:left;min-width:0;border-radius:14px;transition:transform .15s}
.goal:active{transform:scale(.97)}
.goal .gi{position:relative;width:28px;height:28px;flex:none}
.goal .gi svg.ring{position:absolute;inset:0;width:28px;height:28px;transform:rotate(-90deg)}
.goal .gi svg.ico{position:absolute;inset:7px;width:14px;height:14px}
.goal .gt{min-width:0}
.goal .gt b{display:block;font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.goal .gt small{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.goal.over{border-color:rgba(255,138,92,.4)}
.goal.over .gt small{color:#ffb08a}
.goal.done{border-color:rgba(126,211,106,.35)}
.goal.done .gt small{color:var(--good)}
.caption{align-self:center;max-width:100%;min-height:34px;display:flex;align-items:center;gap:8px;padding:6px 6px 6px 13px;font-size:13px;color:#eadccd;border-radius:999px;white-space:nowrap}
.caption span{overflow:hidden;text-overflow:ellipsis;min-width:0}
.caption button{flex:none;font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;background:rgba(246,169,68,.18);color:#ffd08a}
.caption:not(.has-cta){padding-right:13px}

/* ---------- bottom ---------- */
.bottom{position:absolute;left:10px;right:10px;bottom:82px;z-index:6}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.act{display:flex;align-items:center;justify-content:center;gap:9px;height:56px;border-radius:16px;font-family:var(--font-display);font-weight:600;font-size:16px;border:1px solid var(--line);box-shadow:0 8px 22px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.07);transition:transform .12s,filter .2s}
.act:active{transform:scale(.95)}
.act .ai{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none}
.act .ai svg{width:18px;height:18px}
.act.play{background:linear-gradient(180deg,#6a3d14,#3c210c);border-color:rgba(246,169,68,.3)}
.act.play .ai{background:radial-gradient(circle at 35% 30%,#f2ff8a,#b9d531 60%,#7f9a12);color:#fff}
.act.pet{background:linear-gradient(180deg,#5b2230,#311018);border-color:rgba(255,111,134,.28)}
.act.pet .ai{background:rgba(255,111,134,.2);color:#ff8fa1}
.act.sleep{background:linear-gradient(180deg,#352760,#1c1436);border-color:rgba(169,139,255,.3)}
.act.sleep .ai{background:rgba(169,139,255,.2);color:#cbb8ff}
.act[disabled]{filter:grayscale(.6) brightness(.7)}
.nav{position:absolute;left:10px;right:10px;bottom:8px;height:66px;z-index:6;display:grid;grid-template-columns:repeat(6,1fr);align-items:stretch;gap:2px;padding:6px;border-radius:20px}
.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:4px 0;border-radius:14px;font-size:10.5px;font-weight:600;color:var(--muted);transition:color .2s,background .2s}
.nav button svg{width:22px;height:22px}
.nav .l-long{display:none}
.nav button.on{color:var(--amber);background:rgba(246,169,68,.12);box-shadow:inset 0 0 0 1px rgba(246,169,68,.25)}
.nav button.on svg{filter:drop-shadow(0 0 6px rgba(246,169,68,.5))}

/* ---------- sheet ---------- */
.sheet-wrap{position:absolute;inset:0;z-index:20}
.scrim{position:absolute;inset:0;background:rgba(5,3,2,.35);animation:fade .25s}
@keyframes fade{from{opacity:0}}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:78%;display:flex;flex-direction:column;background:linear-gradient(180deg,#241a16,#160f0d);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;box-shadow:0 -20px 50px rgba(0,0,0,.5);animation:up .32s cubic-bezier(.2,.9,.25,1)}
@keyframes up{from{transform:translateY(100%)}}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px 8px}
.sheet-h::before{content:"";position:absolute;left:50%;top:7px;width:40px;height:4px;margin-left:-20px;border-radius:4px;background:rgba(255,255,255,.18)}
.sheet-h h2{margin:0;font-family:var(--font-display);font-weight:700;font-size:24px;letter-spacing:.2px}
.x{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.07);display:grid;place-items:center;flex:none}
.x svg{width:18px;height:18px}
.sheet-b>*{flex-shrink:0}
.sheet-b{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 18px 26px;display:flex;flex-direction:column;gap:14px;-webkit-user-select:text;user-select:text}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:6px 0 0;font-family:var(--font-display);font-weight:600;font-size:16px;color:#f0e2d4}
.sec span{font-family:var(--font-body);font-size:13px;color:var(--muted);font-weight:600}
.lbl{font-size:11.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}
.card{background:rgba(255,240,225,.04);border:1px solid var(--line);border-radius:16px;padding:14px}
.cta{height:54px;border-radius:16px;font-family:var(--font-display);font-weight:600;font-size:17px;color:#2a1606;background:linear-gradient(180deg,#ffc56b,#f39a34);box-shadow:0 10px 24px rgba(243,154,52,.28),inset 0 1px 0 rgba(255,255,255,.5);transition:transform .12s}
.cta:active{transform:scale(.97)}
.cta.blue{color:#04213a;background:linear-gradient(180deg,#8fd3ff,#3ea2ef);box-shadow:0 10px 24px rgba(62,162,239,.28),inset 0 1px 0 rgba(255,255,255,.5)}
.cta.ghost{background:rgba(255,255,255,.06);color:var(--text);box-shadow:none;border:1px solid var(--line)}
.cta.danger{background:rgba(255,90,90,.14);color:#ff9c9c;box-shadow:none;border:1px solid rgba(255,90,90,.3)}

.hero{display:flex;align-items:center;gap:16px}
.ring{position:relative;width:112px;height:112px;flex:none}
.ring svg{width:112px;height:112px;transform:rotate(-90deg)}
.ring .rc{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .rc b{font-family:var(--font-display);font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.ring .rc small{font-size:11px;color:var(--muted)}
.hero p{margin:0;font-size:14px;line-height:1.45;color:#e4d5c6;min-width:0}
.hero p strong{color:var(--amber)}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button,.wstep button{width:52px;height:52px;border-radius:16px;background:rgba(255,255,255,.07);border:1px solid var(--line);font-size:26px;font-weight:600;flex:none}
.stepper .sv{flex:1;text-align:center}
.stepper .sv b{font-family:var(--font-display);font-size:40px;font-variant-numeric:tabular-nums}
.stepper .sv small{font-size:14px;color:var(--muted);margin-left:4px}
.pills{display:flex;flex-wrap:wrap;gap:7px}
.pill{padding:8px 13px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--line);font-size:13.5px;font-weight:600;color:#e4d5c6}
.pill.on{background:rgba(246,169,68,.18);border-color:rgba(246,169,68,.5);color:#ffd08a}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;color:var(--muted);font-weight:600}
.wd i{width:100%;max-width:38px;aspect-ratio:1;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:11px;color:var(--muted)}
.wd.done i{background:linear-gradient(180deg,#ffb553,#e57d22);border-color:transparent;color:#2a1606;font-weight:700}
.wd.part i{background:rgba(246,169,68,.14);border-color:rgba(246,169,68,.35);color:#ffd08a}
.wd.today{color:var(--text)}
.wd.today i{box-shadow:0 0 0 2px rgba(255,255,255,.35)}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:10px;padding:10px 2px;border-top:1px solid var(--line);font-size:14px}
.row:first-child{border-top:0}
.row .rm{flex:1;min-width:0}
.row .rm small{display:block;color:var(--muted);font-size:12px}
.row .rv{font-family:var(--font-display);font-weight:600;font-variant-numeric:tabular-nums}
.row .del{width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.05);color:var(--muted);display:grid;place-items:center}
.row .del svg{width:14px;height:14px}
.empty{font-size:13.5px;color:var(--muted);line-height:1.5}
.wstep{display:flex;align-items:center;gap:10px}
.wfield{flex:1;display:flex;align-items:baseline;justify-content:center;gap:6px;height:64px;border-radius:16px;background:rgba(0,0,0,.25);border:1px solid var(--line)}
.wfield input{width:100%;max-width:150px;background:none;border:0;color:var(--text);font-family:var(--font-display);font-weight:600;font-size:40px;text-align:right;font-variant-numeric:tabular-nums;padding:0;-webkit-user-select:text;user-select:text}
.wfield input:focus{outline:none}
.wfield span{font-size:16px;color:var(--muted);flex:none;padding-right:16px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpi{background:rgba(255,240,225,.04);border:1px solid var(--line);border-radius:14px;padding:10px 11px;min-width:0}
.kpi small{display:block;font-size:11px;color:var(--muted);font-weight:600;white-space:nowrap}
.kpi b{display:block;font-family:var(--font-display);font-size:19px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi b.down{color:var(--good)} .kpi b.up{color:#ffb070}
.chart{width:100%;height:auto}
.chart text{font-family:var(--font-body);font-size:10px;fill:#a99484}
.note{font-size:12.5px;color:var(--muted);line-height:1.5;margin:0}
.ach{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ac{display:flex;gap:10px;padding:11px;border-radius:14px;background:rgba(255,240,225,.035);border:1px solid var(--line);min-width:0}
.ac .ab{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;background:rgba(255,255,255,.05);font-size:19px;filter:grayscale(1) opacity(.5)}
.ac.on{border-color:rgba(246,169,68,.4);background:linear-gradient(180deg,rgba(246,169,68,.12),rgba(246,169,68,.03))}
.ac.on .ab{filter:none;background:rgba(246,169,68,.2)}
.ac .at{min-width:0;flex:1}
.ac .at b{display:block;font-size:13px;line-height:1.2}
.ac .at small{display:block;font-size:11.5px;color:var(--muted);line-height:1.3;margin-top:2px}
.ac .bar{height:5px;margin-top:6px}
.ac .bar i{background:linear-gradient(90deg,#e08a2a,#ffc56b)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.shopgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.item{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:16px;background:rgba(255,240,225,.035);border:1px solid var(--line);min-width:0}

/* ---------- profile gear ---------- */

.macro{display:flex;height:9px;border-radius:9px;overflow:hidden;background:rgba(255,255,255,.08)}

.mp{background:#4fb4ff}.mc{background:#f6a944}.mf{background:#ff6f86}
.mleg{display:flex;flex-wrap:wrap;gap:3px 10px;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}

.ksug{font-size:12px;color:var(--muted)}

.qt.top{background:rgba(126,211,106,.18);color:#a9eb98}.qt.ok{background:rgba(246,169,68,.16);color:#ffd08a}.qt.snack{background:rgba(255,111,134,.16);color:#ff9bab}
.fsearch{display:flex;gap:8px}
.fq{flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:50px;padding:0 12px;border-radius:14px;background:rgba(0,0,0,.25);border:1px solid var(--line)}
.fq svg{width:18px;height:18px;color:var(--muted);flex:none}
.fq input{flex:1;min-width:0;height:100%;background:none;border:0;color:var(--text);font:inherit;font-size:16px;-webkit-user-select:text;user-select:text;-webkit-appearance:none;appearance:none}

.fq:focus-within{border-color:rgba(246,169,68,.6)}
.fscan{flex:none;display:flex;align-items:center;gap:7px;height:50px;padding:0 14px;border-radius:14px;font-weight:700;font-size:14px;color:#2a1606;background:linear-gradient(180deg,#ffc56b,#f39a34);box-shadow:0 8px 20px rgba(243,154,52,.25)}
.fscan svg{width:20px;height:20px}
.fscan:active{transform:scale(.96)}
.hint{font-size:12.5px;color:var(--muted);line-height:1.45;margin:0}
.res{display:flex;flex-direction:column;padding:4px 12px}
.ritem{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);text-align:left;width:100%}
.ritem:first-child{border-top:0}
.ritem .rn{flex:1;min-width:0}
.ritem .rn b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ritem .rn small{display:block;font-size:12px;color:var(--muted)}
.ritem .rk{font-size:12.5px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.ritem.add .rn b{color:#ffd08a}
.flink{align-self:flex-start;font-size:13.5px;font-weight:700;color:#ffd08a;padding:6px 2px}
.prod,.manual{display:flex;flex-direction:column;gap:10px}
.phead{display:flex;align-items:center;gap:12px}
.phead img,.pico{width:56px;height:56px;border-radius:12px;object-fit:contain;background:#fff;flex:none}
.pico{display:grid;place-items:center;font-size:26px;background:rgba(255,255,255,.06)}
.pt{flex:1;min-width:0}
.pt b{display:block;font-size:15.5px;line-height:1.25}
.pt small{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.ns{flex:none;width:30px;height:36px;border-radius:8px;display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:19px;color:#fff;text-transform:uppercase}
.ns.a{background:#038141}.ns.b{background:#85bb2f}.ns.c{background:#fecb02;color:#3a2a00}.ns.d{background:#ee8100}.ns.e{background:#e63e11}

.pnut b{color:var(--text)}
.amt{flex:1;display:flex;align-items:baseline;justify-content:center;gap:6px;height:52px;border-radius:16px;background:rgba(0,0,0,.25);border:1px solid var(--line)}
.amt input{width:100%;max-width:110px;background:none;border:0;color:var(--text);font-family:var(--font-display);font-weight:600;font-size:28px;text-align:right;font-variant-numeric:tabular-nums;padding:0;-webkit-user-select:text;user-select:text}
.amt input:focus{outline:none}
.amt span{font-size:15px;color:var(--muted);flex:none;padding-right:14px}
.padd{display:flex;align-items:center;gap:12px}
.padd span{flex:1;font-family:var(--font-display);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}

.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mgrid label{display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--muted);font-weight:600;min-width:0}
.mgrid .inp{height:44px;font-size:16px;width:100%}
.fbud{display:flex;align-items:center;gap:12px}
.fbud .bl{flex:1;min-width:0}
.fbud .bl b{display:block;font-size:14px}
.fbud .bl small{display:block;font-size:12px;color:var(--muted);margin-top:2px;line-height:1.35}
.bstep{display:flex;gap:6px}
.bstep button{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.07);border:1px solid var(--line);font-size:20px;font-weight:600}
.loading{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted);padding:6px 2px}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(255,255,255,.15);border-top-color:var(--amber);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.recent .pill{font-size:12.5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.flist .row .rm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- barcode scanner ---------- */
.scan{position:absolute;inset:0;z-index:70;background:#000;overflow:hidden}
.scan video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scan-frame{position:absolute;left:50%;top:44%;width:min(84%,440px);aspect-ratio:2.3/1;transform:translate(-50%,-50%);border-radius:18px;box-shadow:0 0 0 200vmax rgba(0,0,0,.55);outline:3px solid rgba(255,255,255,.9);outline-offset:-3px}
.scan-line{position:absolute;left:6%;right:6%;top:50%;height:2px;border-radius:2px;background:#ff5a4f;box-shadow:0 0 12px #ff5a4f;animation:scanl 1.4s ease-in-out infinite alternate}
@keyframes scanl{from{transform:translateY(-32px)}to{transform:translateY(32px)}}
.scan-top{position:absolute;left:0;right:0;top:0;padding:22px 20px 0;text-align:center;color:#fff}
.scan-top b{display:block;font-family:var(--font-display);font-size:22px}
.scan-top small{display:block;font-size:13.5px;color:rgba(255,255,255,.82);margin-top:4px}
.scan-bot{position:absolute;left:0;right:0;bottom:0;padding:0 20px 26px;display:flex;gap:10px;justify-content:center}
.scan-bot button{height:50px;padding:0 22px;border-radius:999px;font-weight:700;font-size:15px;background:rgba(255,255,255,.16);color:#fff;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.scan-bot button.on{background:#ffd36e;color:#2a1606}

/* ---------- storage & install ---------- */
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip-path:inset(50%);pointer-events:none}
.lbtn{display:flex;align-items:center;justify-content:center;cursor:pointer}
.store{display:flex;flex-direction:column;padding:4px 14px}
.srow{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.srow:first-child{border-top:0}
.sic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none;background:rgba(255,255,255,.06);color:var(--muted)}
.sic svg{width:20px;height:20px}
.sic.ok{background:rgba(126,211,106,.14);color:#9fe58c}
.sic.warn{background:rgba(255,170,80,.16);color:#ffb870}
.stx{flex:1;min-width:0}
.stx b{display:block;font-size:14px}
.stx small{display:block;font-size:12px;color:var(--muted);line-height:1.35;margin-top:2px}
.sst{color:var(--good);font-weight:700;font-size:15px}
.install{border-color:rgba(246,169,68,.4);background:linear-gradient(180deg,rgba(246,169,68,.12),rgba(246,169,68,.03))}
.install>b{font-family:var(--font-display);font-size:17px;font-weight:600}
.steps{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:9px}
.steps li{display:flex;align-items:center;gap:11px;font-size:13.5px;line-height:1.35;color:#e9dbcc;text-align:left}
.stepic{width:34px;height:34px;flex:none;border-radius:10px;background:rgba(255,255,255,.08);display:grid;place-items:center;color:#8fd3ff;overflow:hidden}
.stepic svg{width:19px;height:19px}
.stepic img{width:100%;height:100%;object-fit:cover;display:block}
.impbox{border-color:rgba(79,180,255,.45);display:flex;flex-direction:column;gap:8px}
.rotate{display:none}
@media (orientation:landscape) and (max-height:500px) and (pointer:coarse){
  .rotate{display:grid;place-items:center;position:absolute;inset:0;z-index:100;background:var(--bg);text-align:center;padding:20px}
  .rotate svg{width:56px;height:56px;margin:0 auto 12px;color:var(--amber);animation:rot 2.4s ease-in-out infinite}
  .rotate b{display:block;font-family:var(--font-display);font-size:22px}
  .rotate small{display:block;color:var(--muted);margin-top:4px}
}
@keyframes rot{0%,25%{transform:rotate(-90deg)}55%,100%{transform:rotate(0)}}

/* ---------- toasts / modal ---------- */
.toasts{position:absolute;left:0;right:0;top:12px;z-index:40;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;padding:0 16px}
.toast{display:flex;align-items:center;gap:8px;max-width:100%;padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;background:rgba(28,20,17,.94);border:1px solid rgba(246,169,68,.35);box-shadow:0 10px 30px rgba(0,0,0,.45);animation:tin .35s cubic-bezier(.2,1.3,.4,1)}

.modal{position:absolute;inset:0;z-index:50;display:grid;place-items:center;padding:20px;background:rgba(5,3,2,.55)}
.mcard{width:100%;max-width:360px;max-height:calc(100% - 8px);overflow-y:auto;padding:24px 22px 20px;border-radius:26px;text-align:center;background:linear-gradient(180deg,#2c1f19,#191110);border:1px solid rgba(246,169,68,.35);box-shadow:0 30px 80px rgba(0,0,0,.6);animation:pop .45s cubic-bezier(.2,1.4,.4,1);display:flex;flex-direction:column;gap:12px}

.mcard h3{margin:0;font-family:var(--font-display);font-weight:700;font-size:28px}
.mcard p{margin:0;font-size:14.5px;line-height:1.5;color:#e4d5c6}
.mcard .big{font-family:var(--font-display);font-weight:700;font-size:64px;line-height:1;color:var(--amber);text-shadow:0 0 30px rgba(246,169,68,.5)}
.rules{display:flex;flex-direction:column;gap:8px;text-align:left}
.rule{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.05);font-size:13.5px;line-height:1.35}
.rule em{font-style:normal;font-size:20px;flex:none}

}

<script>
'use strict';
/* =========================================================
   DORI — Tamagotchi x Fitness
   ========================================================= */
const $=(s,r=document)=>r.querySelector(s);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const TAU=Math.PI*2;
const app=$('#app');
let TIME=0;

/* ---------------- dates ---------------- */
const pad=n=>String(n).padStart(2,'0');
const dkey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayKey=()=>dkey(new Date());
const parseKey=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d,12)};
function mondayOf(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate(),12);const wd=(x.getDay()+6)%7;x.setDate(x.getDate()-wd);return x}
const weekKey=d=>dkey(mondayOf(d));
const fmtKg=v=>v.toFixed(1).replace('.',',');
const fmtDate=k=>{const d=parseKey(k);return pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'};
const WD=['Mo','Di','Mi','Do','Fr','Sa','So'];

/* ---------------- state & storage ----------------
   Three layers, so nothing gets lost:
   1. this device: localStorage (instant) + IndexedDB mirror, persistent storage requested
   2. inside Claude: private cloud document in the user's Claude account (db capability)
   3. backup file the user saves to Files / iCloud and can load again
   -------------------------------------------------- */
const KEY='dori.save.v1';
const IN_CLAUDE=!!(window.claude&&typeof window.claude.use==='function');
const IS_IOS=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const IS_STANDALONE=(()=>{try{return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}catch(e){return false}})();
function defaults(){return{
  v:1,name:'Dori',created:Date.now(),last:Date.now(),saved:0,rev:0,
  stats:{joy:72,full:40,hyd:46,energy:85},
  xp:0,level:1,bones:30,
  days:{},bowl:{food:0,water:0},
  cnt:{pets:0,plays:0,taps:0,early:0,treats:0,buys:0,scans:0,foods:0},
  weeksHit:{},ach:{},best:0,
  owned:{bed_basic:1,toy_rope:1},equip:{collar:null,bed:'bed_basic',toy:'toy_rope'},decor:{},
  settings:{weekGoal:4,rule:'both',sound:true},intro:false,lastBackup:0,backupNag:0,installSeen:0,
  food:{budget:null,cat:{},recent:[]},
  body:{bcs:5,evalDay:null,hist:{}}
}}
let S;
const validSave=o=>!!(o&&typeof o==='object'&&o.stats&&typeof o.stats==='object'&&o.days&&typeof o.days==='object');
function normalize(o){
  const s=Object.assign(defaults(),o||{});
  for(const k of ['stats','bowl','cnt','owned','equip','settings','food','body'])s[k]=Object.assign(defaults()[k],(o&&o[k])||{});
  if(!s.food.cat||typeof s.food.cat!=='object')s.food.cat={};if(!Array.isArray(s.food.recent))s.food.recent=[];
  if(!s.body.hist||typeof s.body.hist!=='object')s.body.hist={};s.body.bcs=clamp(Number(s.body.bcs)||5,1,9);
  for(const k of ['days','weeksHit','ach','decor'])if(!s[k]||typeof s[k]!=='object')s[k]={};
  return s;
}
function readLocal(){try{const raw=localStorage.getItem(KEY);if(raw){const o=JSON.parse(raw);if(validSave(o))return o}}catch(e){}return null}
const IDB={p:null,
  db(){return this.p||(this.p=new Promise((res,rej)=>{try{const r=indexedDB.open('dori',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}}))},
  async get(k){const db=await this.db();return new Promise((res,rej)=>{const q=db.transaction('kv','readonly').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})},
  async set(k,v){const db=await this.db();return new Promise((res,rej)=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})},
};
const withTimeout=(p,ms)=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),ms))]);
const STORE={local:false,idb:false,persisted:false};
let idbT=null;
// save = write this device (cheap, also called on a timer for slow stat decay)
function save(urgent){
  S.last=Date.now();S.saved=S.last;
  const json=JSON.stringify(S);
  try{localStorage.setItem(KEY,json);STORE.local=true}catch(e){STORE.local=false}
  clearTimeout(idbT);
  const toIdb=()=>IDB.set('save',json).then(()=>{STORE.idb=true}).catch(()=>{STORE.idb=false});
  if(urgent)toIdb();else idbT=setTimeout(toIdb,300);
}
// commit = a real change by the player: stamp it, save here AND sync to the cloud.
// rev only moves on real changes, so an idle device never looks newer than real progress elsewhere.
// urgent = a typed-in entry (training, weight, backup): written everywhere immediately, no debounce.
let warnedNoSave=false;
function commit(urgent){
  S.rev=Date.now();save(urgent);
  if(urgent)Cloud.announce=true;
  Cloud.mark(urgent);
  if(!STORE.local&&!STORE.idb&&!Cloud.on&&Cloud.checked&&!warnedNoSave){warnedNoSave=true;setTimeout(()=>toast('⚠️ Dieser Browser speichert gerade nicht. Sichere bitte ein Backup.'),1600)}
}

/* ---------- merging: entries are never lost ----------
   Trainings and weights from two save states are combined (union per day).
   Progress (level, XP, bones, items, settings) comes from the "base" state. */
const totalXP=s=>{let t=Number(s&&s.xp)||0;for(let l=1;l<(Number(s&&s.level)||1);l++)t+=100*l;return t};
function mergeDay(x,y){
  if(!x||!y){const d=x||y;return d?JSON.parse(JSON.stringify(d)):d}
  const seen=new Set(),gym=[];
  for(const g of [...(x.gym||[]),...(y.gym||[])]){
    if(!g)continue;const e={m:Number(g.m)||0,type:String(g.type||'Training'),t:Number(g.t)||0};
    const k=e.t+'|'+e.m+'|'+e.type;if(seen.has(k))continue;seen.add(k);gym.push(e);
  }
  gym.sort((a,b)=>a.t-b.t);
  const gymMin=gym.reduce((n,g)=>n+g.m,0);
  // weight: the most recent action wins (an entry, a correction or a deletion)
  const xw=Number(x.wt)||0,yw=Number(y.wt)||0;
  let w=x;if(yw>xw||(yw===xw&&x.weight==null&&y.weight!=null))w=y;
  // meals: union by id; a deletion on either side wins (tombstone)
  const del=new Set([...(x.foodDel||[]),...(y.foodDel||[])]),fm=new Map();
  for(const e of [...(x.food||[]),...(y.food||[])])if(e&&e.id&&!del.has(e.id)&&!fm.has(e.id))fm.set(e.id,JSON.parse(JSON.stringify(e)));
  const food=[...fm.values()].sort((a,b)=>(a.t||0)-(b.t||0));
  return{gym,gymMin,meal:!!(x.meal||y.meal),weight:w.weight!=null?Number(w.weight):null,wt:Number(w.wt)||0,water:!!(x.water||y.water),ixp:Math.max(Number(x.ixp)||0,Number(y.ixp)||0),
    food,foodDel:[...del].slice(-200),fxp:Math.max(Number(x.fxp)||0,Number(y.fxp)||0)};
}
function mergeSaves(base,other){
  const m=normalize(JSON.parse(JSON.stringify(base))),o=normalize(other);
  const days={};
  for(const k of new Set([...Object.keys(m.days),...Object.keys(o.days)]))days[k]=mergeDay(m.days[k],o.days[k]);
  m.days=days;
  m.ach=Object.assign({},o.ach,m.ach);m.weeksHit=Object.assign({},o.weeksHit,m.weeksHit);m.owned=Object.assign({},o.owned,m.owned);
  for(const k of Object.keys(o.cnt))m.cnt[k]=Math.max(Number(m.cnt[k])||0,Number(o.cnt[k])||0);
  m.best=Math.max(Number(m.best)||0,Number(o.best)||0);
  m.lastBackup=Math.max(Number(m.lastBackup)||0,Number(o.lastBackup)||0);
  m.intro=!!(m.intro||o.intro);
  m.rev=Math.max(Number(m.rev)||0,Number(o.rev)||0);
  m.created=Math.min(Number(m.created)||Date.now(),Number(o.created)||Date.now());
  m.food.cat=Object.assign({},o.food.cat,m.food.cat);
  return m;
}
const entryDays=s=>Object.values(s.days||{}).filter(d=>d&&((d.gym&&d.gym.length)||d.weight!=null||(d.food&&d.food.length))).length;
function day(k=todayKey()){const d=S.days[k]||(S.days[k]={gym:[],gymMin:0,meal:false,weight:null,water:false,ixp:0});if(!d.food)d.food=[];return d}

const Cloud={on:false,db:null,uid:null,dirty:false,busy:false,timer:null,fails:0,lastSync:0,sent:{},known:new Set(),checked:false,announce:false,
  base(){return this.db.collection('data/users/'+this.uid)},
  async init(localHad){
    if(!IN_CLAUDE){this.checked=true;return}
    try{
      const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
      const uid=user?await user.id():null;
      if(!db||!uid){this.checked=true;refreshStorageUI();return}
      this.db=db;this.uid=uid;
      let snap;try{snap=await this.base().get()}catch(e){if(e&&e.code==='unavailable'){await new Promise(r=>setTimeout(r,800+Math.random()*700));snap=await this.base().get()}else throw e}
      let core=null;const days={};
      for(const d of snap.docs){const v=d.data();if(!v)continue;
        if(d.id==='core')core=v;
        else if(/^(y\d{4}|m\d{4}-\d{2})$/.test(d.id)&&v.days&&typeof v.days==='object'){for(const k in v.days)days[k]=days[k]?mergeDay(days[k],v.days[k]):v.days[k];this.known.add(d.id);this.sent[d.id]=JSON.stringify(v.days)}}
      this.on=true;this.checked=true;
      const remote=core?Object.assign({},core,{days}):null;
      if(remote&&validSave(remote)){
        // newest real change decides progress; trainings and weights from both sides are kept
        const localWins=localHad&&(Number(S.rev)||0)>=(Number(remote.rev)||0);
        const merged=localWins?mergeSaves(S,remote):mergeSaves(remote,S);
        if(!localWins)applyLoaded(merged,localHad?'cloud-newer':'cloud');
        else if(JSON.stringify(merged.days)!==JSON.stringify(S.days)||JSON.stringify(merged.ach)!==JSON.stringify(S.ach))applyLoaded(merged,'merge');
      }
      this.lastSync=Date.now();
      this.mark(true);
    }catch(e){this.on=false;this.checked=true}
    refreshStorageUI();
  },
  mark(urgent){if(!this.on)return;this.dirty=true;if(urgent){clearTimeout(this.timer);this.timer=null;this.flush()}else this.schedule()},
  schedule(ms=1200){clearTimeout(this.timer);this.timer=setTimeout(()=>{this.timer=null;this.flush()},ms)},
  async flush(){
    if(!this.on||this.busy||!this.dirty)return;
    this.busy=true;this.dirty=false;
    try{
      const base=this.base();const {days,...core}=S;
      const cj=JSON.stringify(core);
      if(cj!==this.sent.core){await base.doc('core').set(JSON.parse(cj));this.sent.core=cj}
      const byMonth={};for(const k of Object.keys(days)){const id='m'+k.slice(0,7);(byMonth[id]||(byMonth[id]={}))[k]=days[k]}
      for(const id of Object.keys(byMonth)){const j=JSON.stringify(byMonth[id]);if(j!==this.sent[id]){await base.doc(id).set({days:JSON.parse(j)});this.sent[id]=j;this.known.add(id)}}
      for(const id of [...this.known]){if(!byMonth[id]){await base.doc(id).delete();this.known.delete(id);delete this.sent[id]}}
      this.lastSync=Date.now();this.fails=0;
      if(this.announce&&!this.dirty){this.announce=false;toast('☁️ In deinem Claude-Konto gesichert')}
    }catch(e){
      this.dirty=true;this.fails++;const c=e&&e.code;
      if(['revoked','not_granted','capability_disabled','capability_removed','invalid_argument'].includes(c))this.on=false;
      else if(c==='quota_exceeded'){this.on=false;toast('Der Cloud-Speicher ist voll. Sichere bitte ein Backup.')}
      else if(this.fails<5)setTimeout(()=>this.flush(),2500*this.fails);
    }finally{this.busy=false;if(this.dirty&&this.on&&this.fails===0)this.schedule(400);refreshStorageUI()}
  }
};
// replace the running game state with a loaded one (cloud or backup file)
function applyLoaded(o,src){
  S=normalize(o);offlineCatchUp();S.last=Date.now();curDay=todayKey();day();
  evalBody(true);updateBodyTarget();
  save();layout();refreshHUD(true);
  if(TAB!=='home')renderSheet();
  if(S.intro&&introOpen){introOpen=false;closeModal()}
  D.tasks=[];D.cur=null;D.inBed=false;setState('idle');
  if(src==='cloud')toast('☁️ Spielstand aus deinem Claude-Konto geladen');
  else if(src==='cloud-newer')toast('☁️ Neuester Spielstand aus deinem Claude-Konto geladen');
}
async function requestPersist(){try{if(navigator.storage&&navigator.storage.persist){STORE.persisted=await navigator.storage.persisted();if(!STORE.persisted)STORE.persisted=await navigator.storage.persist()}}catch(e){}}

/* ---------- backup file ---------- */
function backupName(){return 'DORI-Backup-'+todayKey()+'.json'}
async function exportBackup(){
  save();const json=JSON.stringify(S),name=backupName();
  const ok=msg=>{S.lastBackup=Date.now();commit();if(TAB==='settings')renderSheet();toast(msg||'💾 Backup gesichert')};
  if(IN_CLAUDE){
    try{const dl=await claude.use('downloads');if(dl){await dl.save({filename:name,data:json});ok();return}}
    catch(e){const c=e&&e.code;if(c==='declined')return;if(c==='rate_limited'){toast('Einen Moment, dann nochmal tippen.');return}}
  }
  try{const file=new File([json],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'DORI Backup'});ok('💾 Backup gesichert. Tipp: „In Dateien sichern“ wählen.');return}}
  catch(e){if(e&&e.name==='AbortError')return}
  try{const url=URL.createObjectURL(new Blob([json],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},3000);ok()}
  catch(e){toast('Backup konnte nicht erstellt werden.')}
}
let PENDING=null;
function readBackupFile(file){
  if(!file)return;const fr=new FileReader();
  fr.onload=()=>{try{const o=JSON.parse(String(fr.result));if(!validSave(o))throw 0;PENDING=o;renderSheet();const box=$('#impBox');if(box)box.scrollIntoView({block:'nearest',behavior:'smooth'})}catch(e){toast('Diese Datei ist kein DORI-Backup.')}};
  fr.onerror=()=>toast('Die Datei konnte nicht gelesen werden.');
  fr.readAsText(file);
}
function fmtWhen(t){if(!t)return 'noch nie';const d=new Date(t),now=new Date();const same=dkey(d)===dkey(now);const y=new Date(now);y.setDate(now.getDate()-1);
  const hm=pad(d.getHours())+':'+pad(d.getMinutes());if(same)return 'heute, '+hm;if(dkey(d)===dkey(y))return 'gestern, '+hm;return d.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'})}

/* ---------------- audio ---------------- */
const AU={c:null,
  init(){if(!S.settings.sound)return;try{if(navigator.audioSession&&navigator.audioSession.type!=='ambient')navigator.audioSession.type='ambient'}catch(e){}try{if(!this.c)this.c=new (window.AudioContext||window.webkitAudioContext)();if(this.c.state==='suspended')this.c.resume()}catch(e){}},

function ik(hx,hy,fx,fy,a,b,sign){
  let dx=fx-hx,dy=fy-hy,d=Math.hypot(dx,dy)||.01;
  const mx=a+b-.05,mn=Math.abs(a-b)+1;
  if(d>mx){dx*=mx/d;dy*=mx/d;d=mx}
  if(d<mn){dx*=mn/d;dy*=mn/d;d=mn}
  const base=Math.atan2(dy,dx),A=Math.acos(clamp((a*a+d*d-b*b)/(2*a*d),-1,1)),an=base+sign*A;
  return{kx:hx+a*Math.cos(an),ky:hy+a*Math.sin(an),fx:hx+dx,fy:hy+dy};
}
function line(c,x1,y1,x2,y2,w,col){c.strokeStyle=col;c.lineWidth=w;c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke()}
// tapered capsule from (x1,y1) width w1 to (x2,y2) width w2
function limb(c,x1,y1,x2,y2,w1,w2,col){
  const dx=x2-x1,dy=y2-y1,d=Math.hypot(dx,dy)||.001,nx=-dy/d,ny=dx/d;c.fillStyle=col;
  c.beginPath();c.moveTo(x1+nx*w1/2,y1+ny*w1/2);c.lineTo(x2+nx*w2/2,y2+ny*w2/2);c.lineTo(x2-nx*w2/2,y2-ny*w2/2);c.lineTo(x1-nx*w1/2,y1-ny*w1/2);c.closePath();c.fill();
  c.beginPath();c.arc(x1,y1,w1/2,0,TAU);c.fill();c.beginPath();c.arc(x2,y2,w2/2,0,TAU);c.fill();
}

function drawLeg(c,hip,foot,front,near,P){

      break;
    case 'bow':
      P.bodyH=60;P.pitch=.42;P.feet=[{x:66,y:0},{x:70,y:0},{x:-42,y:0},{x:-38,y:0}];P.neck=.9;P.head=.05;P.tail=.55;P.wag=.85;P.wagSpd=15;P.mouth=.4;P.tongue=.5;P.lid=.1;P.earRot=-.15;
      break;
    case 'tug':
      P.bodyH=62;P.pitch=.3;P.feet=[{x:62,y:0},{x:66,y:0},{x:-46,y:0},{x:-42,y:0}];P.neck=1.5;P.head=.6+Math.sin(t*16)*.25;P.mouth=.35;P.tail=.6;P.wag=.8;P.wagSpd=14;P.lid=.25;P.earRot=-.2;
      break;
    case 'happy':{
      const b=Math.max(0,Math.sin(u*9));P.air=14*b;P.feet[0].y=-8*b;P.feet[1].y=-8*b;P.pitch=-.12*b;P.wag=.95;P.wagSpd=20;P.mouth=.5;P.tongue=.8;P.happy=1;P.earRot=-.35;P.neck=.38;P.head=-.05;P.tail=.9;P.lid=0;
      break}
    case 'pet':sit();P.neck=.1;P.head=-.3+Math.sin(t*3)*.05;P.lid=1;P.earRot=-.5;P.wag=.55;P.wagSpd=11;P.mouth=.18;P.tongue=.2;break;
    case 'beg':sit();P.neck=.8;P.head=.75;P.lid=.55;P.earRot=-.4;P.wag=.04;break;
    case 'look':sit();P.neck=.12;P.head=-.28;P.lid=.3;P.earRot=.06;P.look=1;break;
  }
  // figure: a thin Dori droops his ears, a heavy Dori pants on walks
  if(BODY.f<-.4&&!['run','happy','bow','tug'].includes(st))P.earRot-=.3*(-BODY.f-.4)/.6;
  if(BODY.f>.5&&st==='walk'){const a=(BODY.f-.5)/.5;P.mouth=Math.max(P.mouth,.25*a);P.tongue=Math.max(P.tongue,.6*a)}

}
function updatePose(dt){
  const T2=targetPose();const loco=D.state==='walk'||D.state==='run';
  const r1=1-Math.exp(-dt*(loco?14:6.5)),rf=1-Math.exp(-dt*(loco?45:7.5));
  for(const k of PKEYS)D.P[k]=lerp(D.P[k],T2[k],k==='air'?1-Math.exp(-dt*20):r1);
  for(let i=0;i<4;i++){D.P.feet[i].x=lerp(D.P.feet[i].x,T2.feet[i].x,rf);D.P.feet[i].y=lerp(D.P.feet[i].y,T2.feet[i].y,rf)}
  D.wagPh+=dt*D.P.wagSpd;D.brPh+=dt*(D.state==='sleep'?1.5:2.6);
  D.blinkT-=dt;if(D.blinkD>0)D.blinkD-=dt;if(D.blinkT<0){D.blinkD=.14;D.blinkT=rnd(2,6)}
  D.earT-=dt;if(D.earT<0){D.earT=rnd(3,8);D.earTwV=1}
  D.earTwV=(D.earTwV||0)*Math.exp(-dt*6);D.earTw=-.3*D.earTwV*Math.sin(TIME*30);
  D.faceS+=(D.face-D.faceS)*(1-Math.exp(-dt*9));
  BODY.f+=(BODY.target-BODY.f)*(1-Math.exp(-dt*1.2));
  D.st+=dt;
}

/* ---------- tasks ---------- */
function runTasks(dt){
  if(!D.cur){D.cur=D.tasks.shift()||null;if(D.cur){D.cur.el=0;if(D.cur.t==='do'){setState(D.cur.s);D.cur.start&&D.cur.start()}}}
  const c=D.cur;
  if(!c){if(!['idle','sit','lie','sniff'].includes(D.state))setState('idle');D.idleWait-=dt;if(D.idleWait<=0){brain();D.idleWait=rnd(1.4,3.5)}return}
  c.el+=dt;
  switch(c.t){
    case 'move':moveTo(c.x,c.z,c.run,dt)&&(D.cur=null);break;
    case 'chase':{
      const bp=P_(ball.nx,ball.nz),cp=P_(D.nx,D.nz),k=K(D.nz);const side=bp.x>=cp.x?1:-1;
      const tx=(bp.x-side*58*k-L.sx)/L.sw,tz=clamp(ball.nz-.02,0,1);
      const far=Math.hypot(bp.x-cp.x,bp.y-cp.y)>110*k;
      const arrived=moveTo(clamp(tx,.04,.96),tz,far,dt,true);
      if((arrived&&Math.hypot(ball.vx,ball.vz)<.12&&ball.h<2)||c.el>7){D.face=side;D.cur=null}
      break}
    case 'face':D.face=c.dir;if(Math.abs(D.faceS-D.face)<.12)D.cur=null;break;
    case 'do':
      c.tick&&c.tick(dt);
      if(c.until?(c.el>=(c.min||0)&&c.until())||c.el>=(c.d||1e9):c.el>=c.d){c.end&&c.end();D.cur=null}
      break;
    case 'fn':c.f();D.cur=null;break;
  }
}
function moveTo(x,z,run,dt,soft){
  const tp=P_(x,z),cp=P_(D.nx,D.nz);const dx=tp.x-cp.x,dy=tp.y-cp.y,dist=Math.hypot(dx,dy);const k=K(D.nz);
  if(dist<(soft?6:2.5)){if(!soft)setState('idle');return true}
  if(Math.abs(dx)>1.5)D.face=Math.sign(dx);
  setState(run?'run':'walk');
  let sp=(run?185:60)*k*(S.stats.full<25&&!run?.8:1)*(1-.3*Math.max(0,BODY.f)-.15*Math.max(0,-BODY.f));if(Math.abs(D.faceS-D.face)>.5)sp*=.25;
  const step=Math.min(dist,sp*dt);
  D.nx+=dx/dist*step/L.sw;D.nz+=dy/dist*step/(L.fb-L.ft);
  D.phase=(D.phase+(step/k)/(run?72/.38:34/.62))%1;
  return false;
}
const near=(o,dx=0,dz=0)=>({x:clamp(o.x+dx,.03,.97),z:clamp(o.z+dz,0,1)});
function reachX(o,reach){return clamp(o.x-reach*K(o.z)/L.sw,.03,.97)}

/* ---------- behaviours ---------- */
const Act={
  eat(run){
    const o=OBJ.food;const x=reachX(o,90);
    interrupt([{t:'move',x,z:o.z-.035,run},{t:'face',dir:1},
      {t:'do',s:'eat',d:4.2,tick:dt=>{S.bowl.food=Math.max(0,S.bowl.food-dt/4.2);if(Math.random()<dt*7){const s=snoutScreen();spawn('crumb',s.x,s.y,{vx:rnd(-40,40),vy:rnd(-80,-30)});AU.chomp()}},
        end:()=>{S.bowl.food=0;S.stats.full=Math.min(100,S.stats.full+70);S.stats.joy=Math.min(100,S.stats.joy+10);commit();hearts(3)}},
      {t:'do',s:'happy',d:1.6,start:()=>{AU.bark();sayBubble('Lecker!')}}]);
  },
  drink(run){
    const o=OBJ.water;const x=reachX(o,90);
    interrupt([{t:'move',x,z:o.z-.035,run},{t:'face',dir:1},
      {t:'do',s:'drink',d:3.6,tick:dt=>{S.bowl.water=Math.max(0,S.bowl.water-dt/3.6);if(Math.random()<dt*8){const s=snoutScreen();spawn('drop',s.x,s.y,{vx:rnd(-50,50),vy:rnd(-90,-40)});if(Math.random()<.5)AU.lap()}}
        ,end:()=>{S.bowl.water=0;S.stats.hyd=Math.min(100,S.stats.hyd+70);S.stats.joy=Math.min(100,S.stats.joy+6);commit();hearts(2)}},
      {t:'do',s:'happy',d:1.2}]);
  },
  sleep(nap){
    const o=OBJ.bed,dir=o.x<.5?1:-1,off=35*K(o.z)/L.sw;
    interrupt([{t:'move',x:clamp(o.x-dir*off,.03,.97),z:o.z+.015,run:false},{t:'face',dir},{t:'fn',f:()=>{D.inBed=true}},
      {t:'do',s:'sit',d:.6},{t:'do',s:'lie',d:1.2},
      {t:'do',s:'sleep',min:nap?8:6,d:nap?40:1e9,until:()=>S.stats.energy>=97||D.wakeReq},
      {t:'do',s:'wake',d:2,start:()=>{D.wakeReq=false}},{t:'fn',f:()=>{D.inBed=false}}]);
  },
  wake(){if(D.state==='sleep'||D.inBed){D.wakeReq=true;if(D.cur&&D.cur.s==='sleep')D.cur.min=0;else interrupt([])}},
  beg(kind){
    const o=kind==='food'?OBJ.food:OBJ.water;
    interrupt([{t:'move',x:reachX(o,72),z:o.z-.03,run:false},{t:'face',dir:1},
      {t:'do',s:'beg',d:4.5,start:()=>{D.bubble={kind,until:TIME+4.5};AU.whine()}}]);
  },
  play(fromUser){
    const tasks=[];const n=fromUser?3:1;
    for(let i=0;i<n;i++){
      if(fromUser)tasks.push({t:'fn',f:throwBall});
      tasks.push({t:'chase'},{t:'do',s:'bow',d:.55},{t:'fn',f:()=>{pushBall();AU.pop();S.stats.joy=Math.min(100,S.stats.joy+3)}});
    }
    tasks.push({t:'do',s:'happy',d:1.3});

  },
  pet(){interrupt([{t:'do',s:'sit',d:.45},{t:'do',s:'pet',d:3.4,tick:dt=>{if(Math.random()<dt*2.4)hearts(1)}},{t:'do',s:'happy',d:1}])},
  happy(txt){interrupt([{t:'do',s:'happy',d:1.4,start:()=>{AU.bark();if(txt)sayBubble(txt)}}])},
  goto(x,z){const cp=P_(D.nx,D.nz),tp=P_(x,z);interrupt([{t:'move',x,z,run:Math.hypot(tp.x-cp.x,tp.y-cp.y)>L.sw*.35},{t:'do',s:'sit',d:rnd(2.5,4)}])},
};
function brain(){
  const st=S.stats;
  if(S.bowl.food>.02)return Act.eat(false);
  if(S.bowl.water>.02)return Act.drink(false);
  if(st.energy<22)return Act.sleep(false);
  const r=Math.random();
  if(st.full<35&&r<.4)return Act.beg('food');
  if(st.hyd<35&&r<.4)return Act.beg('water');
  const opts=[
    [3,()=>{const x=rnd(.1,.9),z=rnd(.15,.95);D.tasks=[{t:'move',x,z,run:false},{t:'do',s:pick(['idle','sniff','sit','idle']),d:rnd(2,5)}]}],
    [2,()=>{D.tasks=[{t:'do',s:pick(['sit','idle']),d:rnd(3,6)}]}],
    [(st.energy<70?2:.7)+Math.max(0,BODY.f)*1.6,()=>{D.tasks=[{t:'do',s:'sit',d:1},{t:'do',s:'lie',d:rnd(6,12)}]}],
    [st.joy>62&&st.energy>50&&BODY.f<.45?1.3:0,()=>{const t=[];for(let i=0;i<3;i++)t.push({t:'move',x:rnd(.08,.92),z:rnd(.1,.95),run:true});t.push({t:'do',s:'happy',d:1});D.tasks=t}],
    [st.joy>40&&st.energy>35?1:.3,()=>Act.play(false)],
    [1,()=>{const o=toy;D.tasks=[{t:'move',x:reachX(o,70),z:o.z-.02,run:false},{t:'face',dir:1},{t:'do',s:'bow',d:.8},{t:'do',s:'tug',d:2.6,tick:()=>{toy.jig=1}},{t:'fn',f:()=>{toy.jig=0}}]}],
    [.8,()=>{const o=OBJ.window;D.tasks=[{t:'move',x:o.x,z:o.z,run:false},{t:'do',s:'look',d:rnd(4,7)}]}],
    [st.energy<55?1.4:.2,()=>Act.sleep(true)],
  ];
  let sum=opts.reduce((a,o)=>a+o[0],0),x=Math.random()*sum;
  for(const o of opts){x-=o[0];if(x<=0){o[1]();return}}
}

/* ---------- ball & toy ---------- */
const ball={nx:.56,nz:.9,vx:0,vz:0,h:0,vh:0,rot:0};
const toy={x:.3,z:.96,jig:0};
function throwBall(){
  const cp=D.nx;const tx=cp<.5?rnd(.62,.92):rnd(.08,.38);
  ball.nx=clamp(.5+rnd(-.1,.1),.05,.95);ball.nz=1;ball.h=40;ball.vh=220;
  ball.vx=(tx-ball.nx)*1.25;ball.vz=rnd(-.9,-.4);
}
function pushBall(){ball.vx=D.face*rnd(.35,.6);ball.vz=rnd(-.35,.35);ball.vh=rnd(60,120)}
function updateBall(dt){
  ball.nx+=ball.vx*dt;ball.nz+=ball.vz*dt*1.8;
  const f=Math.exp(-dt*(ball.h>0?.3:1.5));ball.vx*=f;ball.vz*=f;
  if(ball.nx<.03){ball.nx=.03;ball.vx=Math.abs(ball.vx)*.6}if(ball.nx>.97){ball.nx=.97;ball.vx=-Math.abs(ball.vx)*.6}
  if(ball.nz<0){ball.nz=0;ball.vz=Math.abs(ball.vz)*.6}if(ball.nz>1){ball.nz=1;ball.vz=-Math.abs(ball.vz)*.6}
  if(ball.h>0||ball.vh>0){ball.vh-=900*dt;ball.h+=ball.vh*dt;if(ball.h<0){ball.h=0;ball.vh=Math.abs(ball.vh)>60?-ball.vh*.45:0}}
  ball.rot+=(ball.vx*L.sw)*dt/(9*K(ball.nz));
}

const PS=[];
function spawn(type,x,y,o={}){PS.push(Object.assign({type,x,y,vx:0,vy:-40,g:0,life:1.2,max:1.2,size:1,rot:0},o));if(PS.length>160)PS.shift()}
function headScreen(){const p=P_(D.nx,D.nz),k=K(D.nz);return{x:p.x+D.faceS*k*D.headL.x,y:p.y-D.P.air*k+k*D.headL.y,k}}
function snoutScreen(){const p=P_(D.nx,D.nz),k=K(D.nz);return{x:p.x+D.faceS*k*D.snoutL.x,y:p.y-D.P.air*k+k*D.snoutL.y,k}}
function hearts(n){const h=headScreen();for(let i=0;i<n;i++)spawn('heart',h.x+rnd(-20,20)*h.k,h.y-20*h.k,{vx:rnd(-20,20),vy:rnd(-70,-45),life:1.6,max:1.6,size:h.k*rnd(.8,1.2)})}

function confetti(x,y,n=60){const cols=['#ffc56b','#ff6f86','#4fb4ff','#b6e35a','#cbb8ff','#fff1b8'];for(let i=0;i<n;i++)spawn('conf',x,y,{vx:rnd(-260,260),vy:rnd(-520,-160),g:620,life:2.2,max:2.2,col:pick(cols),size:rnd(4,8),rot:rnd(0,6),vr:rnd(-10,10)})}

function updateParticles(dt){
  for(let i=PS.length-1;i>=0;i--){const p=PS[i];p.life-=dt;if(p.life<=0){PS.splice(i,1);continue}
    p.vy+=(p.g||0)*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.vr)p.rot+=p.vr*dt;
    if(p.type==='crumb'||p.type==='drop'){p.vy+=400*dt}}
  if(D.state==='sleep'&&Math.random()<dt*.8){const h=headScreen();spawn('z',h.x+12*h.k*D.faceS,h.y-24*h.k,{vx:rnd(8,18)*D.faceS,vy:-26,life:2.6,max:2.6,size:h.k})}
}
function heartPath(c,x,y,s){c.beginPath();c.moveTo(x,y+s*.35);c.bezierCurveTo(x-s*.9,y-s*.25,x-s*.45,y-s*.95,x,y-s*.45);c.bezierCurveTo(x+s*.45,y-s*.95,x+s*.9,y-s*.25,x,y+s*.35);c.closePath()}

      case 'z':c.fillStyle='#cdbcff';c.font=`700 ${Math.round(16*p.size*(1.4-p.life/p.max*.5))}px Fredoka, sans-serif`;c.fillText('z',p.x,p.y);break;

function drawBed(c,front){

    c.fillStyle=gr;c.beginPath();c.ellipse(p.x,cy-6*k,rw,rh+8*k,0,0,TAU);c.fill();

    c.fillStyle=gr;c.beginPath();c.ellipse(p.x,cy-3*k,rw-14*k,rh-4*k,0,0,TAU);c.fill();
    c.strokeStyle='rgba(255,255,255,.06)';c.lineWidth=1;for(let i=1;i<4;i++){c.beginPath();c.ellipse(p.x,cy-3*k,(rw-14*k)*i/4,(rh-4*k)*i/4,0,0,TAU);c.stroke()}
  }
  if(front||!D.inBed){
    let gr=c.createLinearGradient(0,cy,0,cy+rh+8*k);gr.addColorStop(0,rim1);gr.addColorStop(1,rim2);c.fillStyle=gr;

function render(){
  const c=g;c.setTransform(DPR,0,0,DPR,0,0);
  c.drawImage(bg,0,0,L.W,L.H);
  // twinkle & ambient
  c.globalCompositeOperation='lighter';
  for(const t of TW){const a=t.red?(Math.sin(TIME*2+t.p)>.6?.9:.1):(.15+.35*(.5+.5*Math.sin(TIME*1.3+t.p)));c.fillStyle=t.red?`rgba(255,60,60,${a})`:`rgba(255,220,150,${a*.6})`;c.beginPath();c.arc(t.x,t.y,t.red?2.2:1.8,0,TAU);c.fill()}
  for(const b of BULBS){const a=.55+.45*Math.sin(TIME*2.2+b.p);c.fillStyle=b.c;c.globalAlpha=a;c.beginPath();c.arc(b.x,b.y,2.6*L.s,0,TAU);c.fill();c.globalAlpha=a*.25;c.beginPath();c.arc(b.x,b.y,8*L.s,0,TAU);c.fill()}
  c.globalAlpha=1;
  for(let i=0;i<14;i++){const x=L.sx+L.sw*(.55+.45*((i*.618+TIME*.012*(1+i%3))%1)),y=L.wall*.35+((i*.37+TIME*.02)%1)*(L.ft-L.wall*.35);c.fillStyle=`rgba(255,210,160,${.08+.08*Math.sin(TIME+i)})`;c.beginPath();c.arc(x,y,1.3,0,TAU);c.fill()}
  c.globalCompositeOperation='source-over';
  // sortable entities
  const E=[];
  const pb=P_(OBJ.bed.x,OBJ.bed.z);E.push({y:pb.y-1,f:()=>drawBed(c,false)});
  E.push({y:P_(OBJ.food.x,OBJ.food.z).y,f:()=>drawBowl(c,OBJ.food,'food')});
  E.push({y:P_(OBJ.water.x,OBJ.water.z).y,f:()=>drawBowl(c,OBJ.water,'water')});
  E.push({y:P_(toy.x,toy.z).y,f:()=>drawToy(c)});
  E.push({y:P_(ball.nx,ball.nz).y+.5,f:()=>drawBall(c)});
  const dp=P_(D.nx,D.nz);
  E.push({y:dp.y,f:()=>{
    const k=K(D.nz);
    c.fillStyle=`rgba(0,0,0,${.38*(1-clamp(D.P.air/60,0,.6))})`;c.beginPath();c.ellipse(dp.x-4*k*D.faceS,dp.y,68*k*bodyW(.16,.06),9*k,0,0,TAU);c.fill();
    c.save();c.translate(dp.x,dp.y-D.P.air*k);c.scale(k*(Math.abs(D.faceS)<.08?.08*Math.sign(D.faceS||1):D.faceS),k);
    drawDog(c,D.P,D);c.restore();
    if(D.inBed)drawBed(c,true);
  }});
  E.sort((a,b)=>a.y-b.y).forEach(e=>e.f());
  drawHand(c);drawParticles(c);drawBubbles(c);
}

const xpNeed=l=>100*l;
function addXP(n,show=true){
  if(n<=0)return;S.xp+=n;if(show)floatText('+'+n+' XP');
  let up=false;while(S.xp>=xpNeed(S.level)){S.xp-=xpNeed(S.level);S.level++;S.bones+=25;up=true}
  if(up){setTimeout(()=>levelUp(),900)}
  refreshHUD(true);
}
function addBones(n){if(n>0){S.bones+=n;const el=$('#bonesN').parentElement;el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump')}}
function interactionXP(n){const d=day();const room=Math.max(0,40-d.ixp);const g2=Math.min(room,n);d.ixp+=g2;if(g2)addXP(g2)}
function dayComplete(k){const d=S.days[k];if(!d)return false;const gy=d.gymMin>=30,w=d.weight!=null;return S.settings.rule==='both'?gy&&w:S.settings.rule==='any'?gy||w:gy}
function streak(){
  const keys=Object.keys(S.days).filter(dayComplete).sort();if(!keys.length)return{n:0,joker:0};
  const first=parseKey(keys[0]);const per=1+(S.owned.joker?1:0);const used={};
  let n=0,jok=0;const d=new Date();d.setHours(12,0,0,0);
  if(dayComplete(dkey(d)))n++;
  d.setDate(d.getDate()-1);
  for(let i=0;i<800&&d>=first;i++){const k=dkey(d);
    if(dayComplete(k))n++;else{const wk=weekKey(d);if((used[wk]||0)<per){used[wk]=(used[wk]||0)+1;if(wk===weekKey(new Date()))jok++}else break}
    d.setDate(d.getDate()-1)}
  return{n,jokerUsedThisWeek:used[weekKey(new Date())]||0,per};
}
function weekGymDays(ref=new Date()){const m=mondayOf(ref);let n=0;for(let i=0;i<7;i++){const x=new Date(m);x.setDate(m.getDate()+i);const d=S.days[dkey(x)];if(d&&d.gymMin>=30)n++}return n}
function totals(){let gymDays=0,sessions=0,weighs=0,minutes=0;for(const k in S.days){const d=S.days[k];if(d.gymMin>=30)gymDays++;sessions+=d.gym.length;minutes+=d.gymMin;if(d.weight!=null)weighs++}return{gymDays,sessions,weighs,minutes}}
function weights(){return Object.keys(S.days).filter(k=>S.days[k].weight!=null).sort().map(k=>({k,v:S.days[k].weight}))}

function checkAch(){
  for(const a of ACH){if(S.ach[a.id])continue;if(a.v()>=a.goal){S.ach[a.id]=Date.now();const b=a.goal>=30?60:a.goal>=7?30:15;addBones(b);setTimeout(()=>toast(`${a.ic} Erfolg: ${a.n} · +${b} Knochen`),400);AU.coin()}}
}
function logGym(min,type){
  AU.init();const d=day();const wasMeal=d.meal;
  d.gym.push({m:min,type,t:Date.now()});d.gymMin+=min;
  let xp=0,bones=0,meal=false;
  if(!d.meal&&d.gymMin>=30){d.meal=true;meal=true;S.bowl.food=1;xp=50+Math.min(30,d.gymMin-30);bones=10}
  else xp=wasMeal?Math.min(15,Math.round(min/4)):Math.round(min/3);
  const wk=weekKey(new Date());if(weekGymDays()>=S.settings.weekGoal&&!S.weeksHit[wk]){S.weeksHit[wk]=1;bones+=30;setTimeout(()=>toast('🗓️ Wochenziel geschafft · +30 Knochen'),1200)}
  closeSheet();
  addBones(bones);addXP(xp);
  if(meal){toast('🍖 Training gespeichert! Doris Napf ist voll.');buzz(30);Act.eat(true);AU.coin()}
  else if(d.meal){toast(`💪 +${min} Min gespeichert · Bonus-XP`);Act.happy('Wuff!')}
  else{toast(`💪 ${d.gymMin}/30 Min gespeichert · noch ${30-d.gymMin} bis zum Futter`);Act.happy()}
  afterChange(true);
}
function logWeight(kg){
  AU.init();const d=day();const first=d.weight==null&&!d.water;
  d.weight=kg;d.wt=Date.now();
  closeSheet();
  if(first){d.water=true;S.bowl.water=1;if(new Date().getHours()<9)S.cnt.early++;addBones(5);addXP(20);toast('💧 Gewicht gespeichert · Wasser für '+S.name+'!');buzz(30);Act.drink(true);AU.coin()}
  else toast('⚖️ Gewicht gespeichert: '+fmtKg(kg)+' kg');
  afterChange(true);
}
function afterChange(urgent){const s=streak();if(s.n>S.best)S.best=s.n;checkAch();commit(urgent);refreshHUD(true)}

const numOr=(v,d=null)=>{const n=typeof v==='string'?parseFloat(v.replace(',','.')):v;return typeof n==='number'&&isFinite(n)?n:d};

const keyAdd=(k,n)=>{const d=parseKey(k);d.setDate(d.getDate()+n);return dkey(d)};
const normTxt=t=>String(t||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/ß/g,'ss');
function eanValid(code){
  if(!/^(\d{8}|\d{12,14})$/.test(code))return false;
  const d=code.split('').map(Number),chk=d.pop();let sum=0;
  d.reverse().forEach((v,i)=>{sum+=v*(i%2===0?3:1)});
  return (10-sum%10)%10===chk;
}
const NS_Q={a:1,b:.5,c:0,d:-.5,e:-1};
function qualityOf(pr){
  if(pr.ns&&NS_Q[pr.ns]!=null)return NS_Q[pr.ns];
  if(typeof pr.q==='number')return pr.q;
  const k=Math.max(1,pr.kcal||0),sugar=(pr.s||0)*4/k,prot=(pr.p||0)*4/k,fat=(pr.f||0)*9/k;
  let q=clamp((prot-.15)*3,-.3,.6)-clamp((sugar-.15)*2.5,0,1)-clamp((fat-.45)*2,0,.6);
  if(k<60)q+=.3;if(k>450)q-=.3;
  return clamp(Math.round(q*10)/10,-1,1);
}
const qTag=q=>q>=.45?['top','Top']:q>-.3?['ok','Okay']:['snack','Snack'];
function getProduct(code){if(!code)return null;if(code.startsWith('b:'))return BASICS.find(b=>b.code===code)||null;return S.food.cat[code]||null}
function trimCatalog(){
  const ks=Object.keys(S.food.cat);if(ks.length<=300)return;
  ks.sort((a,b)=>(S.food.cat[a].used||0)-(S.food.cat[b].used||0));
  for(const k of ks.slice(0,ks.length-300))delete S.food.cat[k];
}
function fromOFF(p,code){
  const n=p.nutriments||{};
  let kcal=numOr(n['energy-kcal_100g']);
  if(kcal==null){const kj=numOr(n['energy-kj_100g'],numOr(n['energy_100g']));if(kj!=null)kcal=kj/4.184}
  const name=String(p.product_name_de||p.product_name||p.generic_name_de||p.generic_name||'').trim();
  const qty=String(p.quantity||'')+' '+String(p.serving_size||'');
  const unit=/\d\s*(ml|cl|dl|l)\b/i.test(qty)?'ml':'g';
  const sq=numOr(p.serving_quantity);const portion=sq&&sq>0&&sq<3000?Math.round(sq):null;
  const ns=String(p.nutriscore_grade||p.nutrition_grades||'').toLowerCase();
  const img=typeof p.image_front_small_url==='string'&&/^https:\/\//.test(p.image_front_small_url)?p.image_front_small_url:null;

    kcal:kcal==null?null:Math.round(kcal),p:r1(numOr(n.proteins_100g,0)),c:r1(numOr(n.carbohydrates_100g,0)),s:r1(numOr(n.sugars_100g,0)),f:r1(numOr(n.fat_100g,0)),
    unit,portion,plabel:portion?('1 Portion ('+portion+' '+unit+')'):null,ns:/^[a-e]$/.test(ns)?ns:null,img,src:'off',used:Date.now()};
}
function makeEntry(pr,amt){
  const r=amt/100;
  return{id:Date.now().toString(36)+Math.random().toString(36).slice(2,7),t:Date.now(),code:pr.code,name:pr.name,amt:Math.round(amt),unit:pr.unit||'g',
    kcal:Math.round((pr.kcal||0)*r),p:r1((pr.p||0)*r),c:r1((pr.c||0)*r),s:r1((pr.s||0)*r),f:r1((pr.f||0)*r),q:qualityOf(pr),ns:pr.ns||null};
}
function foodTotals(d){
  const t={n:0,kcal:0,p:0,c:0,s:0,f:0,q:0};let qw=0;
  for(const e of (d&&d.food)||[]){t.n++;t.kcal+=e.kcal||0;t.p+=e.p||0;t.c+=e.c||0;t.s+=e.s||0;t.f+=e.f||0;const w=Math.max(10,e.kcal||0);t.q+=(e.q||0)*w;qw+=w}
  t.q=qw?t.q/qw:0;return t;
}
function weightAt(k){let best=null,bk='';for(const dk in S.days){const w=S.days[dk].weight;if(w!=null&&dk<=k&&dk>bk){bk=dk;best=w}}return best}
function baseBudget(k=todayKey()){if(S.food.budget)return S.food.budget;const w=weightAt(k);return w?clamp(Math.round(w*30/50)*50,1500,3800):2200}
function dayBudget(k=todayKey()){const d=S.days[k]||{};const base=baseBudget(k),bonus=Math.min(600,Math.round((d.gymMin||0)*6/10)*10);return{base,bonus,total:base+bonus}}

/* ---------- figure: body condition 1 (sehr dünn) … 5 (ideal) … 9 (dick) ----------
   Each finished day moves Dori: eating clearly above your budget or lots of
   sugary/fatty food makes him rounder, eating far too little makes him thin,
   a balanced day brings him back toward his ideal. Days without entries
   change almost nothing. */
function dayEffect(k){
  const d=S.days[k],t=foodTotals(d);if(!t.n)return null;
  const b=dayBudget(k).total,r=t.kcal/b,e=clamp((r-1)/.35,-1,1),junk=clamp(-t.q,-1,1);
  let delta=.6*e;if(junk>0)delta+=.25*junk*(r>.8?1:.5);
  return{k,kcal:t.kcal,budget:b,r,e,junk,delta,bal:Math.abs(e)<.3,t};
}
function applyDay(bcs,eff){
  if(!eff)return clamp(bcs+(5-bcs)*.04,1,9);
  let delta=clamp(eff.delta,-.7,.7);
  if(eff.bal)delta+=(5-bcs)*.12;
  if(eff.junk<0)delta+=(5-bcs)*.08*(-eff.junk);
  return clamp(bcs+delta,1,9);
}
function evalBody(quiet){
  const last=keyAdd(todayKey(),-1);
  if(!S.body.evalDay){S.body.evalDay=last;return null}
  let k=S.body.evalDay,res=null,guard=0;
  while(k<last&&guard++<400){k=keyAdd(k,1);const eff=dayEffect(k),before=S.body.bcs;S.body.bcs=applyDay(before,eff);S.body.hist[k]=r1(S.body.bcs);if(eff)res={eff,before,after:S.body.bcs}}
  S.body.evalDay=last;
  const ks=Object.keys(S.body.hist).sort();if(ks.length>150)for(const x of ks.slice(0,ks.length-150))delete S.body.hist[x];
  if(res&&res.eff.k===last&&!quiet){
    const dl=res.after-res.before,v=dl>.15?`${S.name} hat zugelegt`:dl<-.15?`${S.name} ist schlanker geworden`:`${S.name} hält seine Figur`;
    setTimeout(()=>toast(`🍽️ Gestern ${fmtInt(res.eff.kcal)} / ${fmtInt(res.eff.budget)} kcal · ${v}`),1800);
  }
  return res;
}
function todayBulge(){const eff=dayEffect(todayKey());return eff?Math.max(0,applyDay(S.body.bcs,eff)-S.body.bcs)*.8:0}
function shownBcs(){return clamp(S.body.bcs+todayBulge(),1,9)}
function updateBodyTarget(){BODY.target=clamp((shownBcs()-5)/4,-1,1)}
const figLabel=b=>b<2.5?'Sehr dünn':b<4?'Dünn':b<=6.2?'Ideal':b<7.5?'Mollig':'Dick';

/* ---------- lookup by article number ---------- */
let lookupSeq=0;
async function lookup(raw,fromScan){
  const code=String(raw||'').replace(/\D/g,'');
  if(code.length<8){toast('Die Artikelnummer unter dem Barcode hat meist 13 Ziffern.');return}
  const seq=++lookupSeq;FS.code=code;FS.fromScan=!!fromScan;
  const local=S.food.cat[code];if(local){selectProduct(local);return}
  if(IN_CLAUDE){toManual('Die Barcode-Suche gibt es in der DORI-App. Trag die Werte von der Verpackung ein (pro 100 g).');return}
  if(!navigator.onLine){toManual('Du bist offline. Trag die Werte von der Verpackung ein (pro 100 g).');return}
  FS.mode='loading';renderFoodPanel();
  try{
    const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),9000);
    const res=await fetch(OFF_API+code+'?fields='+OFF_FIELDS,{signal:ctl.signal,credentials:'omit'});clearTimeout(to);
    if(seq!==lookupSeq)return;
    let j=null;try{j=await res.json()}catch(e){}
    if(!res.ok&&res.status!==404)throw new Error('http '+res.status);
    if(!j||j.status!==1||!j.product){toManual('Dieser Artikel ist noch nicht in der Datenbank. Trag die Werte von der Verpackung ein (pro 100 g), dann kennt DORI ihn beim nächsten Scan.');return}
    const pr=fromOFF(j.product,code);
    if(pr.kcal==null){FS.prefill={name:pr.name,p:pr.p,c:pr.c,s:pr.s,f:pr.f,unit:pr.unit,portion:pr.portion};toManual(`Für «${pr.name}» fehlen die Kalorien. Ergänze sie von der Verpackung.`,true);return}
    S.food.cat[code]=pr;trimCatalog();save();selectProduct(pr);
  }catch(e){if(seq!==lookupSeq)return;toManual('Die Produktdaten sind gerade nicht erreichbar. Trag die Werte von der Verpackung ein (pro 100 g).')}
}
function toManual(msg,keepPrefill){FS.mode='manual';FS.msg=msg;if(!keepPrefill)FS.prefill={name:''};FS.munit=(FS.prefill&&FS.prefill.unit)||'g';renderFoodPanel();scrollPanel()}
function selectProduct(pr,amt){if(!pr)return;FS.sel=pr;FS.mode='product';FS.amt=amt||pr.portion||100;renderFoodPanel();scrollPanel()}
function scrollPanel(){const p=$('#fPanel');if(p&&p.scrollIntoView)setTimeout(()=>p.scrollIntoView({block:'nearest',behavior:'smooth'}),30)}
function localSearch(q){
  const n=normTxt(q).trim();if(!n)return[];
  const pool=[...Object.values(S.food.cat),...BASICS],seen=new Set(),out=[];
  for(const pr of pool){if(seen.has(pr.code))continue;const hay=normTxt(pr.name+' '+(pr.brand||''));if(hay.includes(n)){seen.add(pr.code);out.push(pr)}}
  out.sort((a,b)=>(normTxt(a.name).startsWith(n)?0:1)-(normTxt(b.name).startsWith(n)?0:1));
  return out.slice(0,8);
}

  const v=id=>{const el=$('#'+id);return el?el.value.trim():''};
  const name=v('mName'),kcal=numOr(v('mKcal'));
  if(!name){toast('Gib dem Lebensmittel einen Namen.');$('#mName').focus();return}
  if(kcal==null||kcal<0||kcal>950){toast('Trag die Kalorien pro 100 '+FS.munit+' ein (steht auf der Verpackung).');$('#mKcal').focus();return}

const Scan={on:false,stream:null,det:null,reader:null,timer:0,last:'',hits:0,cv:null,torch:false};
let zxP=null;
function loadZXing(){if(window.ZXing)return Promise.resolve();return zxP||(zxP=new Promise((res,rej)=>{const sc=document.createElement('script');sc.src='zxing.min.js';sc.onload=()=>res();sc.onerror=()=>{zxP=null;rej(new Error('zxing'))};document.head.appendChild(sc)}))}
function scanFail(why){toast(why==='denied'?'📷 Kamera nicht erlaubt. Tippe die Nummer unter dem Strichcode ein.':'📷 Keine Kamera verfügbar. Tippe die Nummer unter dem Strichcode ein.');const i=$('#fq');if(i)setTimeout(()=>i.focus(),300)}
async function openScanner(){
  if(Scan.on)return;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){scanFail('nocam');return}
  AU.init();Scan.on=true;Scan.last='';Scan.hits=0;Scan.torch=false;
  $('#scan').hidden=false;$('#scanTorch').hidden=true;$('#scanTorch').classList.remove('on');$('#scanHint').textContent='Halte den Strichcode in den Rahmen';
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}});
    if(!Scan.on){stream.getTracks().forEach(t=>t.stop());return}
    Scan.stream=stream;const v=$('#scanVid');v.muted=true;v.setAttribute('playsinline','');v.srcObject=stream;
    try{await v.play()}catch(e){}
    try{const tr=stream.getVideoTracks()[0],caps=tr.getCapabilities?tr.getCapabilities():{};if(caps&&caps.torch)$('#scanTorch').hidden=false}catch(e){}
    Scan.det=null;
    if('BarcodeDetector' in window){try{const fm=await window.BarcodeDetector.getSupportedFormats();const want=['ean_13','ean_8','upc_a','upc_e'].filter(f=>fm.includes(f));if(want.length)Scan.det=new window.BarcodeDetector({formats:want})}catch(e){Scan.det=null}}
    if(!Scan.det){
      await loadZXing();
      const Z=window.ZXing,hints=new Map();
      hints.set(Z.DecodeHintType.POSSIBLE_FORMATS,[Z.BarcodeFormat.EAN_13,Z.BarcodeFormat.EAN_8,Z.BarcodeFormat.UPC_A,Z.BarcodeFormat.UPC_E]);
      hints.set(Z.DecodeHintType.TRY_HARDER,true);
      Scan.reader=new Z.MultiFormatReader();Scan.reader.setHints(hints);
    }
    if(Scan.on)scanLoop();
  }catch(e){const denied=e&&(e.name==='NotAllowedError'||e.name==='SecurityError');closeScanner();scanFail(denied?'denied':'nocam')}
}
function zxDecode(v){
  const vw=v.videoWidth,vh=v.videoHeight,cw=vw*.88,ch=Math.min(vh*.44,cw*.62),sx=(vw-cw)/2,sy=clamp(vh*.44-ch/2,0,Math.max(0,vh-ch));
  const sc=Math.min(1,720/cw),W=Math.max(1,Math.round(cw*sc)),H=Math.max(1,Math.round(ch*sc));
  const cv=Scan.cv||(Scan.cv=document.createElement('canvas'));if(cv.width!==W||cv.height!==H){cv.width=W;cv.height=H}
  cv.getContext('2d',{willReadFrequently:true}).drawImage(v,sx,sy,cw,ch,0,0,W,H);
  const Z=window.ZXing;
  try{const bmp=new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.HTMLCanvasElementLuminanceSource(cv)));return Scan.reader.decodeWithState(bmp).getText()}catch(e){return null}
}
async function scanLoop(){
  if(!Scan.on)return;
  const v=$('#scanVid');let code=null;
  try{if(v.readyState>=2&&v.videoWidth){
    if(Scan.det){const r=await Scan.det.detect(v);const hit=r.find(x=>/^\d{8,14}$/.test(x.rawValue||''));if(hit)code=hit.rawValue}
    else if(Scan.reader)code=zxDecode(v);
  }}catch(e){}
  if(!Scan.on)return;
  if(code&&eanValid(code)){
    if(code===Scan.last)Scan.hits++;else{Scan.last=code;Scan.hits=1}
    if(Scan.hits>=2||Scan.det){scanDone(code);return}
  }
  Scan.timer=setTimeout(scanLoop,Scan.det?120:80);
}
function scanDone(code){

}
function closeScanner(){

}

function tickStats(dt){
  const st=S.stats,h=dt/3600;
  st.full=Math.max(8,st.full-4*h);st.hyd=Math.max(8,st.hyd-5*h);
  st.joy=Math.max(15,st.joy-((st.full<30||st.hyd<30)?6:3)*h);
  if(D.state==='sleep')st.energy=Math.min(100,st.energy+.16*dt);
  else st.energy=Math.max(5,st.energy-(D.state==='run'?.05:.022)*dt*(1+.5*Math.max(0,BODY.f)+.3*Math.max(0,-BODY.f)));
}
function offlineCatchUp(){

  st.full=Math.max(8,st.full-4*h);st.hyd=Math.max(8,st.hyd-5*h);st.joy=Math.max(15,st.joy-3*h);st.energy=Math.min(100,st.energy+15*h);
}

function chartSVG(ws){
  const W=340,H=170,pl=34,pr=12,pt=14,pb=24;
  let mn=Math.min(...ws.map(w=>w.v)),mx=Math.max(...ws.map(w=>w.v));const padv=Math.max(.4,(mx-mn)*.15);mn-=padv;mx+=padv;
  const t0=parseKey(ws[0].k).getTime(),t1=parseKey(ws[ws.length-1].k).getTime();
  const X=t=>pl+(t1===t0?.5:(t-t0)/(t1-t0))*(W-pl-pr),Y=v=>pt+(1-(v-mn)/(mx-mn))*(H-pt-pb);
  const pts=ws.map(w=>[X(parseKey(w.k).getTime()),Y(w.v)]);
  const path=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=path+` L${pts[pts.length-1][0].toFixed(1)} ${H-pb} L${pts[0][0].toFixed(1)} ${H-pb} Z`;
  let grid='';for(let i=0;i<=3;i++){const v=mn+(mx-mn)*i/3,y=Y(v);grid+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="rgba(255,230,210,.07)"/><text x="${pl-6}" y="${y+3}" text-anchor="end">${v.toFixed(1).replace('.',',')}</text>`}
  const lp=pts[pts.length-1];
  return `<div class="card" style="padding:10px 6px 4px"><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gewichtsverlauf"><defs><linearGradient id="wa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4fb4ff" stop-opacity=".35"/><stop offset="1" stop-color="#4fb4ff" stop-opacity="0"/></linearGradient></defs>${grid}
  <path d="${area}" fill="url(#wa)"/><path d="${path}" fill="none" stroke="#6fc3ff" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
  ${pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.4" fill="#6fc3ff"/>`).join('')}
  <circle cx="${lp[0]}" cy="${lp[1]}" r="6" fill="#0d1a26" stroke="#9fd9ff" stroke-width="2.5"/>
  <text x="${pl}" y="${H-6}">${fmtDate(ws[0].k)}</text><text x="${W-pr}" y="${H-6}" text-anchor="end">${fmtDate(ws[ws.length-1].k)}</text></svg></div>`;
}

  if(e.target.id==='setName'){S.name=e.target.value.trim()||'Dori';commit();refreshHUD(true)}if(e.target.id==='wIn'){const v=parseKg(e.target.value);if(!isNaN(v))WIN=v}});
const parseKg=s=>parseFloat(String(s).replace(',','.').replace(/[^\d.]/g,''));
$('#sheetBody').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='wIn'){e.preventDefault();$('#wSave').click()}if(e.key==='Enter'&&e.target.id==='fq'){e.preventDefault();runQuery()}if(e.key==='Enter'&&e.target.id==='fAmt'){e.preventDefault();e.target.blur()}});

document.querySelectorAll('#nav button').forEach(b=>b.addEventListener('click',()=>openTab(b.dataset.tab)));
$('#pGear').addEventListener('click',()=>openTab('settings'));
$('#scrim').addEventListener('click',closeSheet);$('#sheetClose').addEventListener('click',closeSheet);

$('#capBtn').addEventListener('click',e=>{e.stopPropagation();openTab(e.currentTarget.dataset.open)});
$('#btnPlay').addEventListener('click',()=>{AU.init();buzz(10);if(busyFeeding()){toast(S.name+' isst gerade, gleich!');return}
  if(S.stats.energy<12){toast(S.name+' ist zu müde zum Spielen.');Act.sleep(false);return}
  S.cnt.plays++;S.stats.joy=Math.min(100,S.stats.joy+6);interactionXP(4);Act.play(true);afterChange()});
$('#btnPet').addEventListener('click',()=>{AU.init();buzz(10);if(busyFeeding())return;
  if(D.state==='sleep'){toast(S.name+' schläft. Lass ihn träumen.');S.stats.joy=Math.min(100,S.stats.joy+2);hearts(2);return}
  S.cnt.pets++;S.stats.joy=Math.min(100,S.stats.joy+8);interactionXP(2);Act.pet();afterChange()});
$('#btnSleep').addEventListener('click',()=>{AU.init();buzz(10);if(D.state==='sleep'||D.inBed){Act.wake();return}if(busyFeeding())return;Act.sleep(S.stats.energy>60)});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal'&&S.intro)closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('#modal').hidden&&S.intro)closeModal();else closeSheet()}});

cv.addEventListener('pointerdown',e=>{
  AU.init();const r=cv.getBoundingClientRect();const x=e.clientX-r.left,y=e.clientY-r.top;
  // dog hit-test
  const dp=P_(D.nx,D.nz),k=K(D.nz);const top=dp.y-(D.state==='sleep'||D.state==='lie'?90:180)*k;
  const bx0=dp.x+Math.min(-70*D.faceS,110*D.faceS)*k,bx1=dp.x+Math.max(-70*D.faceS,110*D.faceS)*k;
  if(x>bx0&&x<bx1&&y>top&&y<dp.y+10){
    S.cnt.taps++;
    if(D.state==='sleep'){Act.wake();toast(S.name+' ist aufgewacht. Etwas grummelig.');return}
    if(busyFeeding()){sayBubble('Mampf!');return}
    S.stats.joy=Math.min(100,S.stats.joy+2);interactionXP(1);Act.happy(pick(['Wuff!','Hm?','Wuff wuff!','…ja?']));hearts(1);return;
  }
  // ball
  const bp=P_(ball.nx,ball.nz),bk=dsc(ball.nz);
  if(Math.hypot(x-bp.x,y-(bp.y-9*bk-ball.h*bk))<26*bk){ball.vx=(x<bp.x?1:-1)*rnd(.4,.7);ball.vz=rnd(-.5,.2);ball.vh=160;AU.pop();if(D.state!=='sleep'&&!busyFeeding()){S.stats.joy=Math.min(100,S.stats.joy+2);interrupt([{t:'chase'},{t:'do',s:'bow',d:.5},{t:'fn',f:pushBall},{t:'do',s:'happy',d:1}])}return}
  // floor
  if(y>L.ft-10&&y<L.fb+20&&x>L.sx&&x<L.sx+L.sw&&D.state!=='sleep'&&!busyFeeding()){
    const nx=clamp((x-L.sx)/L.sw,.06,.94),nz=clamp((y-L.ft)/(L.fb-L.ft),0,1);spawn('ring',x,y,{vy:0,life:.6,max:.6});Act.goto(nx,nz);
  }
});

/* =========================================================
   LOOP
   ========================================================= */
let lastT=performance.now(),hudT=0,saveT=0,curDay=null,running=true;
function frame(now){
  const dt=Math.min(.05,(now-lastT)/1000);lastT=now;TIME+=dt;
  tickStats(dt);runTasks(dt);updatePose(dt);updateBall(dt);updateParticles(dt);
  if(D.bubble&&TIME>D.bubble.until)D.bubble=null;
  D.nx=clamp(D.nx,.02,.98);D.nz=clamp(D.nz,0,1);
  if(!Scan.on)render();
  hudT+=dt;if(hudT>.5){hudT=0;refreshHUD();const k=todayKey();if(k!==curDay){if(curDay){toast('☀️ Neuer Tag! Gym und Morgengewicht sind wieder offen.');evalBody(false);updateBodyTarget();refreshHUD(true);if(TAB!=='home')renderSheet()}curDay=k}}
  saveT+=dt;if(saveT>5){saveT=0;save()}
  if(running)requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange',()=>{
  if(!S)return;
  if(document.hidden){save();if(Cloud.dirty)Cloud.flush();running=false}
  else{offlineCatchUp();S.last=Date.now();lastT=performance.now();refreshHUD(true);if(!running){running=true;requestAnimationFrame(frame)}}
});
window.addEventListener('pagehide',()=>{if(S){save();if(Cloud.dirty)Cloud.flush()}});
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(layout,120)});
document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});

function foodIntro(){
  S.seenFood=true;save();
  modal(`<div class="lbl">Neu in DORI</div><h3>Was du isst, sieht man an ${esc(S.name)}</h3><p>Scanne den Strichcode deiner Lebensmittel oder tippe die Artikelnummer ein. Isst du deutlich mehr als dein Tagesbudget oder viel Süsses, wird ${esc(S.name)} runder. Isst du zu wenig, wird er dünn. Ausgewogen bleibt er in Topform.</p>
  <div class="rules"><div class="rule"><em>📷</em><span><b>Scannen</b> oder die Nummer unter dem Strichcode eintippen</span></div><div class="rule"><em>🐕</em><span>${esc(S.name)}s Figur geht von <b>1 bis 9</b>, ideal ist die Mitte</span></div><div class="rule"><em>⚙️</em><span>Die Einstellungen findest du jetzt oben beim <b>Zahnrad</b></span></div></div>
  <button class="cta" id="mOk">Ausprobieren</button><button class="cta ghost" id="mLater">Später</button>`,m=>{m.querySelector('#mOk').onclick=()=>{closeModal();openTab('food')};m.querySelector('#mLater').onclick=closeModal});
}
function installPrompt(){
  S.installSeen=Date.now();commit();
  modal(`<div class="lbl">Tipp</div><h3>DORI als App</h3><p>Leg Dori auf deinen Home-Bildschirm. Dann startet er im Vollbild wie eine echte App und funktioniert auch offline.</p>${installSteps()}<button class="cta" id="mOk">Verstanden</button>`,m=>m.querySelector('#mOk').onclick=closeModal);
}
function maybeBackupNag(){
  if(IN_CLAUDE&&Cloud.on)return;
  const now=Date.now(),days=Object.keys(S.days).length;
  if(days>=5&&now-S.lastBackup>14*864e5&&now-S.backupNag>7*864e5){S.backupNag=now;save();setTimeout(()=>toast('💾 Tipp: Sichere ab und zu ein Backup unter Einstellungen → Speicher.'),2500)}
}
async function start(){
  let o=readLocal(),had=!!o;
  try{const raw=await withTimeout(IDB.get('save'),1200);if(raw){const io=JSON.parse(raw);if(validSave(io)&&(!o||(io.saved||0)>(o.saved||0))){o=io;had=true}}}catch(e){}
  S=normalize(o);offlineCatchUp();S.last=Date.now();curDay=todayKey();day();
  evalBody(false);updateBodyTarget();BODY.f=BODY.target;avatarF=BODY.f;save();
  layout();refreshHUD(true);
  requestAnimationFrame(frame);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>layout());
  requestPersist();
  Cloud.init(had);
  if(!S.intro)setTimeout(()=>{if(!S.intro)intro()},900);
  else if(canInstall()&&!S.installSeen)setTimeout(installPrompt,1200);
  else if(!S.seenFood)setTimeout(foodIntro,1400);
  else setTimeout(maybeBackupNag,4000);
}
if(window.claude&&window.claude.hot&&window.claude.hot.ready)window.claude.hot.ready(start);else start();
</script>

<script>
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')){
  // a new version takes over in the background; reload once at a quiet moment
  const hadController=!!navigator.serviceWorker.controller;let reloading=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!hadController||reloading)return;reloading=true;if(window.DORI_SAFE_RELOAD)window.DORI_SAFE_RELOAD();else location.reload()});
  window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').then(reg=>{document.addEventListener('visibilitychange',()=>{if(!document.hidden)reg.update().catch(()=>{})})}).catch(()=>{})});
}
</script>
