const svErrText=k=>({net:'Strava ist gerade nicht erreichbar.',rate:'Strava-Limit erreicht. In 15 Minuten geht es weiter.',auth:'Die Strava-Verbindung ist abgelaufen. Bitte neu verbinden.',
  scope:'DORI darf deine Aktivitäten nicht sehen. Bitte neu verbinden und den Zugriff erlauben.',http:'Strava hat einen Fehler gemeldet. Versuch es später nochmal.'})[k]||'';
function svStatus(){if(SY.busy)return 'Wird synchronisiert …';if(ST.err)return svErrText(ST.err);return ST.last?'Zuletzt synchronisiert: '+fmtWhen(ST.last):'Noch nicht synchronisiert'}
function svUI(){const t=svStatus();document.querySelectorAll('[data-svstate]').forEach(el=>{el.textContent=t});document.querySelectorAll('[data-svbusy]').forEach(b=>{b.disabled=SY.busy})}

// token exchange and refresh: a plain form POST (no custom headers)
async function svToken(params){
  let r,j=null;
  try{r=await fetch(SV_WEB+'/oauth/token',{method:'POST',body:new URLSearchParams(Object.assign({client_id:ST.cid,client_secret:ST.sec},params)),credentials:'omit',cache:'no-store'})}
  catch(e){throw svErr('net')}
  try{j=await r.json()}catch(e){}
  if(!r.ok||!j||!j.access_token)throw svErr(r.status===429?'rate':r.status>=400&&r.status<500?'auth':'http',r.status);
  ST.acc=String(j.access_token);if(j.refresh_token)ST.ref=String(j.refresh_token);
  ST.exp=Number(j.expires_at)||Math.floor(Date.now()/1000)+(Number(j.expires_in)||21600);
  if(j.athlete&&typeof j.athlete==='object')ST.ath={id:j.athlete.id,name:String(j.athlete.firstname||'').slice(0,40)};
  saveST();return j;
}
async function svAccess(force){
  if(!ST.ref)throw svErr('auth');
  if(!force&&ST.acc&&(Number(ST.exp)||0)*1000>Date.now()+120e3)return ST.acc; // access tokens live 6 h
  await svToken({grant_type:'refresh_token',refresh_token:ST.ref});
  return ST.acc;
}
async function svGet(path,again){
  const tok=await svAccess(again);let r;
  try{r=await fetch(SV_API+path,{headers:{Authorization:'Bearer '+tok},credentials:'omit',cache:'no-store'})}
  catch(e){ // the header can trip the browser's cross-site check: try once with the token in the address
    try{r=await fetch(SV_API+path+(path.includes('?')?'&':'?')+'access_token='+encodeURIComponent(tok),{credentials:'omit',cache:'no-store'})}catch(e2){throw svErr('net')}
  }
  if(r.status===401){let m='';try{m=JSON.stringify(await r.json())}catch(e){}
    if(/activity:read/.test(m))throw svErr('scope',401);
    if(!again)return svGet(path,true);
    throw svErr('auth',401)}
  if(r.status===429)throw svErr('rate',429);
  if(!r.ok)throw svErr('http',r.status);
  return r.json();
}

function stravaConnect(force){
  if(!svCreds()){toast('Trag zuerst Client-ID und Client Secret von Strava ein.');const el=$(/^\d+$/.test(ST.cid||'')?'#svSec':'#svCid');if(el)el.focus();return}
  if(!navigator.onLine){toast('Du bist offline. Verbinde dich zuerst mit dem Internet.');return}
  ST.state=Math.random().toString(36).slice(2,10)+Date.now().toString(36);ST.err='';saveST();save(true);
  location.href=SV_WEB+'/oauth/authorize?client_id='+encodeURIComponent(ST.cid)+'&response_type=code&redirect_uri='+encodeURIComponent(stravaRedirect())+
    '&approval_prompt='+(force?'force':'auto')+'&scope='+SV_SCOPE+'&state='+ST.state;
}
// read Client-ID and Secret from the settings fields (kept on every keystroke, so switching apps loses nothing)
function svCreds(){
  const c=$('#svCid'),s=$('#svSec');if(c)ST.cid=c.value.replace(/\D/g,'');if(s)ST.sec=s.value.replace(/\s/g,'');if(c||s)saveST();
  return /^\d{1,12}$/.test(ST.cid||'')&&/^[A-Za-z0-9]{20,80}$/.test(ST.sec||'');
}
async function stravaFinish(code,scope){
  if(scope&&!/activity:read/.test(scope)){ST.err='scope';saveST();svScopeModal();return false}
  try{await svToken({code,grant_type:'authorization_code'})}
  catch(e){ST.state='';saveST();svFailModal(e);return false}
  ST.state='';ST.err='';ST.from=Date.now()-7*864e5;ST.since=ST.since||Date.now();saveST();
  toast('✓ Mit Strava verbunden'+(ST.ath&&ST.ath.name?', '+ST.ath.name:''));buzz(20);
  if(TAB==='settings'&&!inputFocused())renderSheet();
  setTimeout(()=>stravaSync(true),700);
  return true;
}
// Strava sends the browser back here with ?code=…&scope=…&state=… (or ?error=access_denied)
function stravaCallback(){
  if(IN_CLAUDE)return false;
  let q;try{q=new URLSearchParams(location.search)}catch(e){return false}
  const code=q.get('code'),err=q.get('error'),scope=q.get('scope')||'',state=q.get('state')||'';
  if(!((code&&(scope||state))||(err&&state)))return false;
  try{history.replaceState(null,'',location.pathname+location.hash)}catch(e){}
  if(err){ST.state='';saveST();setTimeout(()=>toast('Strava-Verbindung abgebrochen'),700);return true}
  // landed in a browser that doesn't know the Strava details (e.g. Safari instead of the app)
  if(!(ST.cid&&ST.sec)){setTimeout(()=>svCodeModal(code),700);return true}
  setTimeout(()=>stravaFinish(code,scope),300);
  return true;
}
function stravaUseCode(){
  const raw=String(($('#svCode')||{}).value||'').trim();let code=raw,scope='';
  try{if(/^https?:/i.test(raw)){const u=new URL(raw);code=u.searchParams.get('code')||'';scope=u.searchParams.get('scope')||''}}catch(e){}
  if(!/^[A-Za-z0-9]{10,100}$/.test(code)){toast('Das sieht nicht nach einem Strava-Code aus.');return}
  if(!svCreds()){toast('Trag zuerst Client-ID und Client Secret ein.');return}
  const i=$('#svCode');if(i)i.blur();
  stravaFinish(code,scope);
}
async function stravaDisconnect(){
  const tok=ST.acc,ref=ST.ref,cid=ST.cid,sec=ST.sec;
  Object.assign(ST,{acc:'',ref:'',exp:0,ath:null,err:'',state:''});saveST();
  if(TAB==='settings')renderSheet();toast('Strava getrennt');
  // tell Strava too, so DORI also disappears from your Strava settings (best effort)
  try{const r=await fetch(SV_WEB+'/oauth/revoke',{method:'POST',headers:{Authorization:'Basic '+btoa(cid+':'+sec)},body:new URLSearchParams({token:ref||tok}),credentials:'omit'});if(r.ok)return}catch(e){}
  try{if(tok)await fetch(SV_WEB+'/oauth/deauthorize?access_token='+encodeURIComponent(tok),{method:'POST',credentials:'omit'})}catch(e){}
}
function stravaForget(){ST={};saveST();if(TAB==='settings')renderSheet();toast('Strava-Zugangsdaten gelöscht')}

// pairs a Strava workout with the same one you typed in by hand (usually logged right after it)
function svTwin(d,start,end,min){
  let best=null,bd=Infinity;
  for(const g of d.gym){if(g.sid)continue;const dt=Math.min(Math.abs(g.t-end),Math.abs(g.t-start));
    if(dt<=3*3600e3&&Math.abs(g.m-min)<=Math.max(15,min*.4)&&dt<bd){bd=dt;best=g}}
  return best;
}
function svKnown(){const s=new Set();for(const k in S.days){const d=S.days[k];if(!d)continue;for(const g of d.gym||[])if(g&&g.sid)s.add(String(g.sid));for(const x of d.gymDel||[])if(String(x)[0]==='s')s.add(String(x).slice(1))}return s}
const svKcal=a=>{const c=Number(a&&a.calories);if(c>0)return Math.round(c);const kj=Number(a&&a.kilojoules);return kj>0?Math.round(kj):0}; // bike kJ ≈ kcal burned

async function stravaSync(manual){
  if(!stravaOn())return null;
  if(SY.busy)return SY.p;
  if(!navigator.onLine){if(manual)toast('Du bist offline. Strava holt alles nach, sobald du online bist.');return null}
  SY.busy=true;svUI();
  SY.p=(async()=>{
    const now=Date.now(),k0=todayKey(),known=svKnown(),shown0=shownBcs();
    const from=clamp(Number(ST.from)||now-7*864e5,now-30*864e5,now);
    let added=0,kcal=0,partial=false;const today=[],res={meal:false,xp:0,bones:0,week:false};
    try{
      const list=[];
      for(let page=1;page<=4;page++){const part=await svGet(`/athlete/activities?after=${Math.floor(from/1000)}&per_page=50&page=${page}`);if(!Array.isArray(part))break;list.push(...part);if(part.length<50)break}
      const fresh=list.filter(a=>a&&a.id!=null&&!known.has(String(a.id))&&(Number(a.moving_time)||Number(a.elapsed_time)||0)>=180&&/^\d{4}-\d{2}-\d{2}/.test(String(a.start_date_local||'')))
        .sort((a,b)=>(Date.parse(a.start_date)||0)-(Date.parse(b.start_date)||0));
      const byDay={};let details=0;
      for(const a of fresh){
        let kc=svKcal(a);
        if(!(Number(a.calories)>0)){ // the calories only come with the detailed activity
          const stop=()=>{partial=true;ST.from=(Date.parse(a.start_date)||now)-60e3};
          if(details>=25){stop();break}
          try{const full=await svGet('/activities/'+encodeURIComponent(a.id));details++;kc=svKcal(full)||kc}
          catch(e){if(e.kind==='auth'||e.kind==='scope')throw e;stop();break}
        }
        const k=String(a.start_date_local).slice(0,10),start=Date.parse(a.start_date)||now;
        const min=Math.max(1,Math.round((Number(a.moving_time)||Number(a.elapsed_time))/60)),end=start+(Number(a.elapsed_time)||min*60)*1000;
        const e={m:min,type:SV_TYPES[a.sport_type]||SV_TYPES[a.type]||'Training',t:start,src:'strava',sid:String(a.id)};if(kc>0)e.kcal=kc;
        const d=day(k),tw=svTwin(d,start,end,min),arr=byDay[k]||(byDay[k]=[]);
        if(tw){e.tw=tw.t;d.gym[d.gym.indexOf(tw)]=e;recalcGym(d)}else arr.push(e); // typed-in twin: replace, no double rewards
        added++;kcal+=sessionKcal(e,k);if(k===k0)today.push(e);
      }
      for(const k of Object.keys(byDay).sort()){const r=addSessions(k,byDay[k]);if(r.meal&&k===k0)res.meal=true;res.xp+=r.xp;res.bones+=r.bones;if(r.week)res.week=true}
      if(!partial)ST.from=now-2*864e5; // look 2 days back next time: late uploads still arrive
      ST.last=Date.now();ST.err='';ST.n=(Number(ST.n)||0)+added;saveST();
    }catch(e){
      ST.err=e&&e.kind||'http';if(ST.err==='auth'||ST.err==='scope'){ST.acc='';ST.ref='';ST.exp=0}
      saveST();if(added)save();
      if(manual||ST.err==='auth'||ST.err==='scope')toast('⚠️ '+svErrText(ST.err));
      if(TAB==='settings'&&!inputFocused())renderSheet();
      return{error:ST.err};
    }finally{SY.busy=false;svUI()}
    if(added){
      if(res.meal)S.bowl.food=1;
      addBones(res.bones);addXP(res.xp);updateBodyTarget();afterChange(true);
      const tk=today.reduce((n,e)=>n+sessionKcal(e,k0),0);
      toast(added===1&&today.length===1?`🔥 Strava: ${today[0].type} ${today[0].m} Min · ${fmtInt(tk)} kcal`:`🔥 Strava: ${added} ${added===1?'Aktivität':'Aktivitäten'} übernommen · ${fmtInt(kcal)} kcal`);
      if(res.week)setTimeout(()=>toast('🗓️ Wochenziel geschafft · +30 Knochen'),2600);
      if(res.meal)setTimeout(()=>{toast('🍖 Training von Strava · '+S.name+'s Napf ist voll!');buzz(30);Act.eat(true);AU.coin()},1200);
      else if(today.length&&shownBcs()<shown0-.05&&D.state!=='sleep'&&!busyFeeding())setTimeout(()=>{Act.happy('Leichter!');floatText('−'+fmtInt(tk)+' kcal','#ff9a62')},900);
      if(TAB!=='home'&&!inputFocused())renderSheet();
    }else if(manual)toast('Strava: nichts Neues');
    return{added,kcal};
  })();
  return SY.p;
}

async function copyText(t,msg){
  try{await navigator.clipboard.writeText(t);toast(msg||'Kopiert');return}catch(e){}
  try{const ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;top:0;left:0;opacity:0';document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,t.length);const ok=document.execCommand('copy');ta.remove();toast(ok?(msg||'Kopiert'):'Kopieren ging nicht. Halte den Text gedrückt.')}
  catch(e){toast('Kopieren ging nicht. Halte den Text gedrückt.')}
}

    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'DORI-Symbol'});return}
    const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='DORI-Symbol.png';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},3000);toast('DORI-Symbol gesichert')}
  catch(e){if(e&&e.name==='AbortError')return;window.open('icon-512.png','_blank')}
}

let avatarF=0;


/* ---------- stats decay ---------- */
function tickStats(dt){
  const st=S.stats,h=dt/3600;
  st.full=Math.max(8,st.full-4*h);st.hyd=Math.max(8,st.hyd-5*h);
  st.joy=Math.max(15,st.joy-((st.full<30||st.hyd<30)?6:3)*h);
  if(D.state==='sleep')st.energy=Math.min(100,st.energy+.16*dt);
  else st.energy=Math.max(5,st.energy-(D.state==='run'?.05:.022)*dt*(1+.5*Math.max(0,BODY.f)+.3*Math.max(0,-BODY.f)));
}
function offlineCatchUp(){
  const h=clamp((Date.now()-S.last)/3.6e6,0,24*14);if(h<.01)return;const st=S.stats;

let capKey='';
function updateCaption(){
  const n=S.name,st=S.stats,d=day();let t,cta=null;
  switch(D.state){
    case 'sleep':t=`${n} schläft tief und fest. Zzz…`;break;
    case 'eat':t='Mampf! Dein Training füllt den Napf.';break;
    case 'drink':t='Schlabber, schlabber. Frisches Wasser!';break;
    case 'beg':t=D.bubble&&D.bubble.kind==='water'?`Leerer Wassernapf. Morgengewicht = Wasser.`:`${n} starrt auf den leeren Napf…`;cta=D.bubble&&D.bubble.kind==='water'?(d.weight==null?['weight','Wiegen']:null):(d.meal?null:['gym','Zum Gym']);break;
    case 'run':t=D.cur&&D.cur.t==='chase'?'Ball! Ball! BALL!':'Zoomies! Volle Energie.';break;
    case 'bow':case 'tug':t=`${n} will spielen.`;break;
    case 'pet':case 'fpet':t='Guter Junge. Sehr guter Junge.';break;
    case 'happy':t=`${n} freut sich riesig.`;break;
    case 'wake':t=`${n} streckt sich und gähnt.`;break;
    case 'look':t=`${n} beobachtet die Stadtlichter.`;break;
    case 'lie':t=`${n} macht es sich gemütlich.`;break;
    default:
      if(!d.meal&&st.full<45){t=`${n} hat Hunger. 30 Min Training = Futter.`;cta=['gym','Zum Gym']}
      else if(d.weight==null&&st.hyd<50){t=`${n} hat Durst. Morgengewicht = Wasser.`;cta=['weight','Wiegen']}
      else if(shownBcs()>=7.5){t=`${n} ist ganz schön rund. Ausgewogen essen hilft ihm.`;cta=['food','Essen']}
      else if(shownBcs()<=2.5){t=`${n} ist sehr dünn. Iss genug, dann geht's ihm besser.`;cta=['food','Essen']}
      else if(!d.food.length&&new Date().getHours()>=11){t=`Was hast du heute gegessen? ${n} will es wissen.`;cta=['food','Essen']}
      else if(st.energy<30)t=`${n} wird langsam müde.`;
      else t=pick2([`${n} wirkt gelangweilt. Wie immer.`,`${n} schaut dich erwartungsvoll an.`,`Tipp: Tippe auf ${n} oder den Ball.`]);
  }
  const key=t+(cta?cta[0]:'');if(key===capKey)return;capKey=key;
  $('#capTxt').textContent=t;const b=$('#capBtn');
  if(cta){b.hidden=false;b.textContent=cta[1];b.dataset.open=cta[0];$('#caption').classList.add('has-cta')}else{b.hidden=true;$('#caption').classList.remove('has-cta')}
}

function chartSVG(ws){
  const W=340,H=170,pl=34,pr=12,pt=14,pb=24;
  let mn=Math.min(...ws.map(w=>w.v)),mx=Math.max(...ws.map(w=>w.v));const padv=Math.max(.4,(mx-mn)*.15);mn-=padv;mx+=padv;
  const t0=parseKey(ws[0].k).getTime(),t1=parseKey(ws[ws.length-1].k).getTime();
  const X=t=>pl+(t1===t0?.5:(t-t0)/(t1-t0))*(W-pl-pr),Y=v=>pt+(1-(v-mn)/(mx-mn))*(H-pt-pb);
  const pts=ws.map(w=>[X(parseKey(w.k).getTime()),Y(w.v)]);
  const path=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=path+` L${pts[pts.length-1][0].toFixed(1)} ${H-pb} L${pts[0][0].toFixed(1)} ${H-pb} Z`;
  let grid='';for(let i=0;i<=3;i++){const v=mn+(mx-mn)*i/3,y=Y(v);grid+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="rgba(255,230,210,.07)"/><text x="${pl-6}" y="${y+3}" text-anchor="end">${v.toFixed(1).replace('.',',')}</text>`}
  const lp=pts[pts.length-1];
  return `<div class="card" style="padding:10px 6px 4px"><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gewichtsverlauf"><defs><linearGradient id="wa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4fb4ff" stop-opacity=".35"/><stop offset="1" stop-color="#4fb4ff" stop-opacity="0"/></linearGradient></defs>${grid}
  <path d="${area}" fill="url(#wa)"/><path d="${path}" fill="none" stroke="#6fc3ff" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
  ${pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.4" fill="#6fc3ff"/>`).join('')}
  <circle cx="${lp[0]}" cy="${lp[1]}" r="6" fill="#0d1a26" stroke="#9fd9ff" stroke-width="2.5"/>
  <text x="${pl}" y="${H-6}">${fmtDate(ws[0].k)}</text><text x="${W-pr}" y="${H-6}" text-anchor="end">${fmtDate(ws[ws.length-1].k)}</text></svg></div>`;
}

cv.addEventListener('pointerdown',e=>{
  AU.init();const r=cv.getBoundingClientRect();const x=e.clientX-r.left,y=e.clientY-r.top;
  // dog hit-test
  const dp=P_(D.nx,D.nz),k=K(D.nz);const top=dp.y-(D.state==='sleep'||D.state==='lie'?90:180)*k;
  const bx0=dp.x+Math.min(-70*D.faceS,110*D.faceS)*k,bx1=dp.x+Math.max(-70*D.faceS,110*D.faceS)*k;
  if(x>bx0&&x<bx1&&y>top&&y<dp.y+10){
    S.cnt.taps++;
    if(D.state==='sleep'){Act.wake();toast(S.name+' ist aufgewacht. Etwas grummelig.');return}
    if(busyFeeding()){sayBubble('Mampf!');return}
    S.stats.joy=Math.min(100,S.stats.joy+2);interactionXP(1);
    if(D.state==='front'&&(D.fv||0)>.5){D.fpop=1;sayBubble(pick(['Hm?','…ja?','Was?','Wuff.']));hearts(1);return}
    Act.happy(pick(['Wuff!','Hm?','Wuff wuff!','…ja?']));hearts(1);return;
  }
  // ball
  const bp=P_(ball.nx,ball.nz),bk=dsc(ball.nz);
  if(Math.hypot(x-bp.x,y-(bp.y-9*bk-ball.h*bk))<26*bk){ball.vx=(x<bp.x?1:-1)*rnd(.4,.7);ball.vz=rnd(-.5,.2);ball.vh=160;AU.pop();if(D.state!=='sleep'&&!busyFeeding()){S.stats.joy=Math.min(100,S.stats.joy+2);interrupt([{t:'chase'},{t:'do',s:'bow',d:.5},{t:'fn',f:pushBall},{t:'do',s:'happy',d:1}])}return}
  // floor
  if(y>L.ft-10&&y<L.fb+20&&x>L.sx&&x<L.sx+L.sw&&D.state!=='sleep'&&!busyFeeding()){
    const nx=clamp((x-L.sx)/L.sw,.06,.94),nz=clamp((y-L.ft)/(L.fb-L.ft),0,1);spawn('ring',x,y,{vy:0,life:.6,max:.6});Act.goto(nx,nz);
  }
});

  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>layout());
  requestPersist();
  Cloud.init(had);
  await loadSTBackup();
  const cb=stravaCallback(); // back from Strava's login page?
  if(!cb&&stravaOn())setTimeout(()=>stravaSync(false),1500);
  if(cb){} // the Strava step shows its own messages
  else if(!S.intro)setTimeout(()=>{if(!S.intro)intro()},900);
  else if(canInstall()&&!S.installSeen)setTimeout(installPrompt,1200);
  else if(!S.seenFood)setTimeout(foodIntro,1400);
  else if(!S.seenEnergy)setTimeout(energyIntro,1400);
  else setTimeout(maybeBackupNag,4000);
}
if(window.claude&&window.claude.hot&&window.claude.hot.ready)window.claude.hot.ready(start);else start();
</script>

  const hadController=!!navigator.serviceWorker.controller;let reloading=false;

    try{c.postMessage('build',[ch.port2])}catch(e){reloadNow();return}
